<!doctype html>
<!--
  LOOM, the master build
  playground build, 2026-09-22

  WHAT IT IS
  One dark room under a night sky. A sheet of cloth hangs gathered from a rail, and seven threads
  hang from its hem, each a different length. A wind circulates through the room. A dye grows its
  own pattern IN THE CLOTH'S MATERIAL COORDINATES, and where the dye is dense the cloth is stiffer,
  so the pattern is a material, not a texture painted on top. When the wind bends a thread far
  enough it plucks, and the note is tuned to that thread's length.

      wind moves cloth -> cloth carries dye -> dye stiffens cloth -> cloth plucks threads

  Drag through it. Grab the cloth and it follows you and leaves dye where you held it; stir the
  air near the threads and they sing. Sound starts on your first touch, never on load.
  No tabs, no modes, no settings.

  WHAT IT TAUGHT ME
  It is built from thirty earlier builds in this folder, and its job is to make their strongest
  lessons hold at the same time, in one world, rather than one at a time in a lab. The full list,
  seventy-six lessons with the builds they came from, is in LEDGER.md beside this file. The ones
  that are load bearing here:
  - XPBD compliance is an inverse spring constant, and alpha is divided by the SUBSTEP squared
    (xpbd-lab, xpbd-cloth, linen). Damping is taken per substep on velocity BEFORE gravity, or it
    quietly rescales gravity (the bug that shipped three times).
  - A compliance that is a SCALE can reach zero, and zero is a rigid plate (drape-scenes). The dye
    scales compliance, so every dyed constraint has a floor.
  - Curl noise is exactly divergence free, and the look depends on it (sway, driftfield). Motes
    are advected at the midpoint, because forward Euler compresses a divergence free flow anyway.
  - Gray-Scott's nine point stencil and its diffusion constants are a matched pair (petri), and
    the timestep sits at 80% of explicit Euler's ceiling of 2/1.6 (reaction).
  - Karplus-Strong cannot play in tune without a fractional-delay allpass, and loop gain lands
    once per trip around the buffer (pluck). Thresholds are relative and hysteretic, because a
    harp that cannot make a sound looks exactly like a quiet one (aeolian).
  - Browsers do not gamut map (gamut, gamut-second-take). Every colour here comes from ONE OKLCH
    hue, the hue of the Showcase's night sky ground #0D0A22, chroma-bisected into sRGB, spaced on
    WCAG contrast rather than on lightness, with contrast computed from the shipped hex.
  - Every draw is hashed from seed and position, never from a shared random stream (grainsmith),
    so two runs from one seed are bit identical.

  And what it taught that none of the thirty had:
  - Skip-one bend links, fine on every flat cloth in this folder, fight a gathered rail: they want
    the flat width back. Rail links sat at 15 to 19% strain at ANY compliance (at one iteration per
    substep a stiff link's correction is set by inverse mass, not compliance) and the restless
    sheet plucked 36 notes in 20 seconds of dead calm. The pleats are now sewn into the rest shape.
  - Without self-collision one drag can pass the sheet through itself into a crease that no local
    constraint can tell from rest. It was found by looking at a screenshot with every check green.
  - A hysteresis band that is too wide silences a harp as surely as a threshold that is too high:
    a thread held in a steady curve never falls far enough to re-arm.

  WHY IT EXISTS
  The playtime log found that half of the thirty builds were the same three shapes: ten cloth
  solvers, three reaction diffusion fields, two colour tools. Each stood alone. `aeolian` was the
  first to make four ideas depend on each other; this is the second, and it tries to be the one a
  person with no interest in any of that would still want to play with.

  HOW IT IS CHECKED
  Predictions first, in _verify/PREDICTIONS_loom.md. Engine suite _verify/check_loom.js (physics,
  wind, dye, colour, sound against closed forms that live in the checker, never here), end to end
  suite _verify/check_loom_ui.js (real pointer, real audio gesture, preview contract, screenshots
  that were looked at). Receipts in _verify/RESULTS.md.

  Self-contained, offline, no dependencies. ?seed=N picks a world. ?preview=1 is the index card.
-->

<script>
"use strict";
/* ================================================================== *
 * 0. Query, seed, hashing
 *
 * No shared random stream anywhere. Every draw is a hash of what it is
 * for (seed, purpose, index, step), so skipping or reordering work can
 * never change another draw. That is what lets two runs be compared
 * bit for bit (grainsmith's lesson).
 * ================================================================== */
const QS = new URLSearchParams(location.search);
const PREVIEW = QS.has("preview");
const SEED = (parseInt(QS.get("seed"), 10) >>> 0) || 1618;

function hash32(a, b, c, d) {

  h = Math.imul(h ^ (h >>> 16), 0x7FEB352D) ^ Math.imul(b | 0, 0xC2B2AE35);
  h = Math.imul(h ^ (h >>> 15), 0x846CA68B) ^ Math.imul(c | 0, 0x27D4EB2F);
  h = Math.imul(h ^ (h >>> 16), 0x165667B1) ^ Math.imul(d | 0, 0x9E3779B1);
  h ^= h >>> 15; h = Math.imul(h, 0x2C1B3C6D);

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;

/* ================================================================== *
 * 1. Colour. One hue, OKLCH, chroma bisection, spaced on contrast.
 *
 * Published Oklab constants (Ottosson). The checker converts with its
 * own numerically exact inverse, and the gap between the two is its
 * tolerance (gamut's lesson: the published pair are inverses only to
 * about 4e-8).
 * ================================================================== */
const M_LIN_LMS = [[0.4122214708, 0.5363325363, 0.0514459929],
                   [0.2119034982, 0.6806995451, 0.1073969566],
                   [0.0883024619, 0.2817188376, 0.6299787005]];
const M_LMS_LAB = [[0.2104542553, 0.7936177850, -0.0040720468],
                   [1.9779984951, -2.4285922050, 0.4505937099],
                   [0.0259040371, 0.7827717662, -0.8086757660]];

                   [1, -0.1055613458, -0.0638541728],
                   [1, -0.0894841775, -1.2914855480]];

                   [-1.2684380046, 2.6097574011, -0.3413193965],
                   [-0.0041960863, -0.7034186147, 1.7076147010]];

function oklchToLin(L, C, H) {

  let l = M_LAB_LMS[0][0] * L + M_LAB_LMS[0][1] * A + M_LAB_LMS[0][2] * B;
  let m = M_LAB_LMS[1][0] * L + M_LAB_LMS[1][1] * A + M_LAB_LMS[1][2] * B;
  let s = M_LAB_LMS[2][0] * L + M_LAB_LMS[2][1] * A + M_LAB_LMS[2][2] * B;
  l = l * l * l; m = m * m * m; s = s * s * s;
  return [M_LMS_LIN[0][0] * l + M_LMS_LIN[0][1] * m + M_LMS_LIN[0][2] * s,
          M_LMS_LIN[1][0] * l + M_LMS_LIN[1][1] * m + M_LMS_LIN[1][2] * s,

function linToOklch(rgb) {

  const m = Math.cbrt(M_LIN_LMS[1][0] * r + M_LIN_LMS[1][1] * g + M_LIN_LMS[1][2] * b);
  const s = Math.cbrt(M_LIN_LMS[2][0] * r + M_LIN_LMS[2][1] * g + M_LIN_LMS[2][2] * b);
  const L = M_LMS_LAB[0][0] * l + M_LMS_LAB[0][1] * m + M_LMS_LAB[0][2] * s;
  const A = M_LMS_LAB[1][0] * l + M_LMS_LAB[1][1] * m + M_LMS_LAB[1][2] * s;
  const B = M_LMS_LAB[2][0] * l + M_LMS_LAB[2][1] * m + M_LMS_LAB[2][2] * s;

const linToSrgb = c => c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;

const GAMUT_EPS = 1e-9;
function inGamut(L, C, H) {
  const v = oklchToLin(L, C, H);
  return v[0] >= -GAMUT_EPS && v[0] <= 1 + GAMUT_EPS && v[1] >= -GAMUT_EPS &&
         v[1] <= 1 + GAMUT_EPS && v[2] >= -GAMUT_EPS && v[2] <= 1 + GAMUT_EPS;
}
/* Chroma bisection: hold L and H, find the largest chroma still inside
 * sRGB. 24 halvings of the requested chroma. Browsers do not do this;
 * they clip each channel, which is a walk along a cube axis and moves
 * the hue (gamut-second-take measured 32.67 degrees at worst). */
const BISECT_ITERS = 24;
function gamutMap(L, C, H) {
  if (inGamut(L, C, H)) return { L, C, H, mapped: false, requested: C };
  let lo = 0, hi = C;
  for (let i = 0; i < BISECT_ITERS; i++) {
    const mid = (lo + hi) / 2;
    if (inGamut(L, mid, H)) lo = mid; else hi = mid;

}
function linToBytes(lin) { return lin.map(c => Math.round(clamp(linToSrgb(clamp(c, 0, 1)), 0, 1) * 255)); }
function bytesToHex(b) { return "#" + b.map(x => x.toString(16).padStart(2, "0")).join(""); }
function lumFromLin(lin) { const c = lin.map(x => clamp(x, 0, 1)); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }

const contrastY = (y1, y2) => (Math.max(y1, y2) + 0.05) / (Math.min(y1, y2) + 0.05);

/* The hue. #0D0A22, the Showcase ground, is oklch(0.1651 0.0485 285.48).
 * Seeding the one hue from the ground rather than from the violet
 * accent (281.7, four degrees away) makes ramp[0] the ground itself, so
 * the room does not merely resemble the night sky, it is that colour. */
const HUE = 285.478;
const GROUND = { L: 0.165136, C: 0.048482 };
const C_PEAK = 0.205;              // requested; beyond sRGB near both ends of the ramp

}
const colourRequests = [];
function colourAtL(L, record) {
  const req = chromaRequest(L);
  const m = gamutMap(L, req, HUE);
  const lin = oklchToLin(m.L, m.C, HUE);
  const bytes = linToBytes(lin);
  if (record) colourRequests.push({ L, C: req, H: HUE, mappedC: m.C, mapped: m.mapped });
  return { L, C: m.C, requested: req, mapped: m.mapped, lin, bytes, hex: bytesToHex(bytes) };
}
const Y_GROUND = lumFromBytes(linToBytes(oklchToLin(GROUND.L, GROUND.C, HUE)));
/* L for a target contrast against the ground, by bisection on the float. */
function lForContrast(target) {
  let lo = GROUND.L, hi = 0.995;
  for (let i = 0; i < 48; i++) {
    const mid = (lo + hi) / 2;
    const c = colourAtL(mid, false);
    if (contrastY(lumFromLin(c.lin), Y_GROUND) < target) lo = mid; else hi = mid;
  }

/* The ramp: 256 colours whose CONTRAST against the ground rises
 * geometrically from 1 to C_MAX, so equal steps in index are equal
 * perceived steps in legibility. Oklab uniformity is not WCAG
 * uniformity (gamut-second-take: 14.9x between largest and smallest
 * step), and every renderer below indexes this ramp, so lighting is a
 * move along the ramp and never a new colour. */
const C_MAX = 15;
const RAMP_N = 256;
const ramp = [];
for (let i = 0; i < RAMP_N; i++) {
  const target = Math.pow(C_MAX, i / (RAMP_N - 1));
  const L = i === 0 ? GROUND.L : lForContrast(target);

const toneOf = c => Math.log(c) / Math.log(C_MAX);      // contrast -> ramp position 0..1
/* Named tokens: a target contrast, and for anything a person must read
 * or see as a control, a floor. The floor is checked on the HEX that
 * ships, never on the float (gamut's lesson), and a token that misses
 * is walked up the ramp until it clears. */
const TOKEN_SPEC = {
  ground: { c: 1.0 },  haze: { c: 1.2 },  star: { c: 9.5 },
  clothDeep: { c: 1.28 }, cloth: { c: 1.9 }, dye: { c: 4.6 }, sheen: { c: 9 },
  thread: { c: 3.4, floor: 3.0 }, bead: { c: 5.5, floor: 3.0 }, glow: { c: 13.5 },
  rail: { c: 3.6, floor: 3.0 }, mote: { c: 7.5 },
  ink: { c: 11, floor: 7.0 }, dim: { c: 5.6, floor: 4.5 }, edge: { c: 3.4, floor: 3.0 }

    name, L: col.L, C: col.C, H: HUE, hex: col.hex, bytes: col.bytes, lin: col.lin,
    target: spec.c, floor: spec.floor || null, tone: toneOf(Math.max(1, spec.c)),
    contrastHex: contrastY(lumFromBytes(col.bytes), Y_GROUND),

function applyCssTokens() {

  s.setProperty("--ink", tokens.ink.hex);

  s.setProperty("--edge", tokens.edge.hex);

/* ================================================================== *
 * 2. The wind: curl of a 3D vector potential, so exactly divergence
 *    free. Open domain: the lattice is hashed, never taken modulo, so
 *    no seam can staple a source and a sink to the room (driftfield).
 * ================================================================== */

function vnoise(c, x, y, z, salt) {

  const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10);
  const v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const w = fz * fz * fz * (fz * (fz * 6 - 15) + 10);

  const cc = lattice(c, xi, yi + 1, zi, salt), d = lattice(c, xi + 1, yi + 1, zi, salt);
  const e = lattice(c, xi, yi, zi + 1, salt), f = lattice(c, xi + 1, yi, zi + 1, salt);
  const g = lattice(c, xi, yi + 1, zi + 1, salt), hh = lattice(c, xi + 1, yi + 1, zi + 1, salt);

/* Curl by central differences at step HC. Every mixed difference in

 * checker can hold it to 1e-12 and not merely "small". */
function windAt(F, x, y, z, t, out) {
  const h = WIND.HC, k = 1 / (2 * h);

  const dAy_dz = (potential(F, 1, x, y, z + h, t) - potential(F, 1, x, y, z - h, t)) * k;
  const dAx_dz = (potential(F, 0, x, y, z + h, t) - potential(F, 0, x, y, z - h, t)) * k;
  const dAz_dx = (potential(F, 2, x + h, y, z, t) - potential(F, 2, x - h, y, z, t)) * k;
  const dAy_dx = (potential(F, 1, x + h, y, z, t) - potential(F, 1, x - h, y, z, t)) * k;
  const dAx_dy = (potential(F, 0, x, y + h, z, t) - potential(F, 0, x, y - h, z, t)) * k;

  out[1] = dAx_dz - dAz_dx;

/* The control the checker uses: same potential, wired as a gradient.
 * Nothing in the app can reach it. */
function gradientWindAt(F, x, y, z, t, out) {
  const h = WIND.HC, k = 1 / (2 * h);
  out[0] = (potential(F, 0, x + h, y, z, t) - potential(F, 0, x - h, y, z, t)) * k;
  out[1] = (potential(F, 0, x, y + h, z, t) - potential(F, 0, x, y - h, z, t)) * k;
  out[2] = (potential(F, 0, x, y, z + h, t) - potential(F, 0, x, y, z - h, t)) * k;
  return out;
}
/* One advection step. Midpoint is what the app uses; Euler exists for
 * the checker's comparison (driftfield: Euler's Jacobian is
 * 1 + dt*div + dt^2*det, and only the middle term is zero). */
const _wa = [0, 0, 0], _wb = [0, 0, 0];
function advect(F, p, t, dt, method, field) {
  const fn = field || windAt;
  fn(F, p[0], p[1], p[2], t, _wa);
  if (method === "euler") { p[0] += dt * _wa[0]; p[1] += dt * _wa[1]; p[2] += dt * _wa[2]; return p; }
  const mx = p[0] + 0.5 * dt * _wa[0], my = p[1] + 0.5 * dt * _wa[1], mz = p[2] + 0.5 * dt * _wa[2];
  fn(F, mx, my, mz, t + 0.5 * dt, _wb);
  p[0] += dt * _wb[0]; p[1] += dt * _wb[1]; p[2] += dt * _wb[2];
  return p;
}

/* ================================================================== *
 * 3. The solver: XPBD, one particle system for cloth and threads.
 *
 * alpha_tilde = alpha / h^2 with h the SUBSTEP. Damping per substep on
 * velocity, BEFORE gravity, as a rate per second, so it neither rescales
 * gravity nor changes with the schedule. One iteration per substep: a
 * wind-loaded sheet is always moving, and on a moving sheet substeps beat

function applyPointer() {
  const F = world.field, S = world.sys;
  const speed = Math.hypot(ptr.vx, ptr.vy);
  if (ptr.grab >= 0) {
    const i = ptr.grab, target = unprojectToZ(ptr.x, ptr.y, ptr.grabZ);
    S.kt[3 * i] = target[0]; S.kt[3 * i + 1] = target[1]; S.kt[3 * i + 2] = target[2];
    if (i < CW * CH) {
      const u = (i % CW) / (CW - 1), v = Math.floor(i / CW) / (CH - 1);
      dyeDeposit(world.dye, u, v, 2.6, 0.05); world.deposits++;
    }
  }
  if (ptr.active && speed > 1) {
    const wp = pointerWorld(); ptr.lastWorld = wp;
    const pxPerM = cam.h / (2 * Math.tan(cam.fov / 2) * (cam.eye[2] - 0.1));
    const sp = Math.min(speed / pxPerM, 7);                 // metres per second
    F.eddy = { x: wp[0], y: wp[1], z: 0.0, r: 0.32, dx: ptr.vx / speed, dy: -ptr.vy / speed, s: sp * 3.1 };
    ptr.eddyPeak = Math.max(ptr.eddyPeak, F.eddy.s);
  } else if (F.eddy) {
    F.eddy.s *= 0.86; if (Math.abs(F.eddy.s) < 1e-3) F.eddy = null;
  }
  ptr.vx *= 0.9; ptr.vy *= 0.9;
}

/* ================================================================== *
 * 10. The loop
 * ================================================================== */
let world = null, acc = 0, lastNow = 0, running = true, drawn = 0;
function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  cam.dpr = dpr;
  for (const c of [backC, glC, frontC]) { c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.max(1, Math.round(h * dpr)); }
  setupCamera(w, h);
  skyCache = buildSky(w, h);
}
function frame(now) {
  if (!running) return;
  const dt = Math.min(0.1, Math.max(0, (now - lastNow) / 1000)); lastNow = now;
  acc += dt;
  let n = 0;
  while (acc >= DT && n < 3) {
    if (!PREVIEW) applyPointer();
    const before = world.events.length;
    worldStep(world);
    for (let e = before; e < world.events.length; e++) playVoice(world.events[e]);
    acc -= DT; n++;
  }
  if (n === 3) acc = 0;
  render(now); drawn++;
  requestAnimationFrame(frame);
}
function boot() {
  applyCssTokens();
  resize();
  initGL();
  world = createWorld({ seed: SEED });
  /* preroll: the cloth finds its folds and the dye is already growing
   * on the first frame anyone sees */
  for (let k = 0; k < 700; k++) dyeStep(world.dye, { Du: DYE.Du, Dv: DYE.Dv, dt: DYE.dt, F: world.dyeRows.F, k: world.dyeRows.k });
  settle(world, 3);
  render(performance.now()); drawn++;
  window.addEventListener("resize", () => { resize(); render(performance.now()); });
  frontC.addEventListener("pointerdown", onDown);
  frontC.addEventListener("pointermove", onMove);
  frontC.addEventListener("pointerup", onUp);
  frontC.addEventListener("pointercancel", onUp);
  frontC.addEventListener("pointerleave", e => { if (!ptr.down) ptr.active = false; });
  document.getElementById("sound").addEventListener("click", e => { e.stopPropagation(); setSound(!audio.on); });
  window.addEventListener("keydown", e => {
    if (e.key === "m" || e.key === "M") setSound(!audio.on);
  });
  lastNow = performance.now();
  requestAnimationFrame(frame);
}
if (PREVIEW) document.documentElement.classList.add("preview");

/* ================================================================== *
 * 11. The test surface. Pure functions and state; the closed forms
 *     the checker holds them to live in the checker.
 * ================================================================== */
window.__loom = {
  version: "2026-09-22", seed: SEED, preview: PREVIEW,
  palette: { HUE, GROUND, C_MAX, ramp, tokens, requests: colourRequests, gamutMap, inGamut, oklchToLin, linToOklch,
             linToBytes, bytesToHex, lumFromBytes, lumFromLin, contrastY, BISECT_ITERS, matrices: { M_LIN_LMS, M_LMS_LAB, M_LAB_LMS, M_LMS_LIN } },
  wind: { WIND, windAt, gradientWindAt, potential, advect, gustOf, ROOM, field: s => ({ windScale: 1, salt: hash32(s ?? SEED, 99, 0, 0) & 0xffff, eddy: null }) },
  dye: { DYE, DYE_W, DYE_H, dyeState, dyeStep, dyeRows, dyeSeed, dyeDensity, DYE_LO, DYE_HI },
  solver: { System, hangRig, COMPLIANCE, SUB, DT, REST, CW, CH, RAIL_Y, GATHER },
  synth: { renderString, renderNaive, THREAD_HZ, THREAD_T60, THREAD_LEN, PLUCK_ON, PLUCK_OFF },
  createWorld, worldStep, settle, simulate, worldMetrics, healthy, threadBend, updateCompliance,
  get world() { return world; }, audio, ptr, cam, project, unprojectToZ,
  get gl() { return !!gl; }, get drawn() { return drawn; },
  pause() { running = false; }, resume() { if (!running) { running = true; lastNow = performance.now(); requestAnimationFrame(frame); } },
  renderNow(o) {
    const keep = { ...view }; Object.assign(view, o || {});
    render(performance.now()); drawn++; Object.assign(view, keep);
  },
  setWorld(W) { world = W; }
};
boot();
</script>

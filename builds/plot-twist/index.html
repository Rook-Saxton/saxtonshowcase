<!--
  PLOT TWIST
  builds/plot-twist/index.html
  Built 2026-09-23. Self-contained: no dependencies, no network, opens offline from the file system.

  WHAT IT IS
  A challenge randomizer for life-simulation playthroughs. Press Deal and seven cards spin like a
  slot machine and flip over: a starting budget band, a household setup, a house rule, a career
  direction (a broad job family, never a specific game's career), a personality to play, a goal,
  and a twist that lands on a set day. Lock any card to keep it while the rest re-roll. A
  difficulty dial (cosy, spicy, chaotic) weights which entries can appear; every entry carries its
  own difficulty tag. Press Play and the run becomes a checklist with a day counter; the twist
  stays sealed until its day comes round. Runs save to a history, share as a short code that
  deals the exact same run, and download as a PNG card. Every list is our own generic writing and
  is editable on the My lists screen (add, remove, change a tag, reset to defaults). A tool, not
  a game: no score, no lives, no pause.

  CONTROLS
  Space (or the Deal button): deal a run; pressed while the reels spin, it stops them at once.
  1 to 7: lock or unlock a card. D: turn the difficulty dial. M: mute. Everything is also a button,
  and the whole tool works by touch. Escape closes a dialog and is never swallowed.

  HOW IT WAS CHECKED
  The pure logic sits between LOGIC-BEGIN and LOGIC-END and was sliced out and run in node:
  127 checks, all passing. They cover list sizes and tags, the same seed and lists always dealing
  the same run (500 seeds), locked cards surviving 2400 chained re-rolls, every dial position
  dealing a full run (2000 seeds each, plus lists stripped down to a single tag or one entry),
  share codes round-tripping (1000 random codes, including locked-card groups), and edits to the
  lists changing the version so an old code warns. Headless Chrome through Playwright, 66 checks,
  all passing: at 1280x720 by keyboard and mouse (deal, stop the reels, locks, dial, share code,
  PNG download, code paste, checklist, twist day, reload, list edits and the warning, export,
  import, mute, Escape not prevented), at 390x844 by touch, with localStorage throwing, with
  reduced motion, and ?preview=1 at 600x300 for 30 seconds (7 deals, no writes, no audio, no
  errors). Zero page or console errors in every run.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plot Twist</title>
<style>
:root{--mari:#FFE066;--tom:#FF4F6D;--grass:#C6F432;--pool:#22D3C5;--grape:#B45CF0;--bub:#FF7AC8;--lav:#B9A8FF;--tang:#FF8A3D;--peri:#8C9BFF;--ink:#1A1540;--paper:#F7F4FF;--r:18px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.4 ui-rounded,"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;overflow-x:hidden;

button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
svg{display:block}
.ic{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:24px;letter-spacing:-.01em;margin-right:auto}
.logo .mark{width:40px;height:40px;border-radius:12px;background:var(--grape);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);transform:rotate(-6deg)}
.logo .mark svg{width:26px;height:26px}
.logo .mark .ic{stroke:#fff;stroke-width:2.6}
nav{display:flex;gap:6px}
.tab{border:2.5px solid var(--ink);background:#fff;border-radius:99px;padding:6px 14px;font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.tab[aria-selected=true]{background:var(--ink);color:#fff}
.iconbtn{width:42px;height:42px;border-radius:14px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);padding:0}
.iconbtn svg{width:24px;height:24px}
.iconbtn[aria-pressed=true]{background:var(--lav)}
button:active{transform:translateY(2px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pool);outline-offset:2px}
main{padding:0 18px 22px;max-width:1280px;margin:0 auto}
.screen[hidden]{display:none}
/* the deal bar */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:8px 0 12px;background:linear-gradient(var(--paper) 78%,#F7F4FF00)}
.dial{display:flex;align-items:center;gap:8px}
.knob{width:52px;height:52px;border:none;background:none;padding:0}
.knob svg{width:52px;height:52px}
.needle{transition:transform .35s cubic-bezier(.3,1.6,.5,1);transform-origin:26px 26px}
.seg{display:flex;border:2.5px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff;box-shadow:0 3px 0 var(--ink)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:800;font-size:14px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed=true][data-d=cosy]{background:var(--grass)}
.seg button[aria-pressed=true][data-d=spicy]{background:var(--tang)}
.seg button[aria-pressed=true][data-d=chaotic]{background:var(--grape);color:#fff}
.dealbtn{margin-left:auto;border:3px solid var(--ink);background:var(--tom);color:#fff;font-weight:900;font-size:22px;border-radius:99px;padding:8px 26px 8px 22px;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;gap:10px;letter-spacing:.02em}
.dealbtn svg{width:26px;height:26px}
.dealbtn .ic{stroke:#fff;stroke-width:2.6}
.dealbtn kbd{font:700 12px/1 ui-monospace,Consolas,monospace;background:#fff3;border-radius:6px;padding:4px 6px}
.hint{font-size:13px;opacity:.75}
/* cards */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{position:relative;min-width:0}
.cin{position:relative;height:100%;background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 5px 0 var(--ink);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-height:220px;overflow:hidden}
.cin::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:var(--c)}
.card.locked .cin{background:#FFFBE5}
.card.locked::after{content:"";position:absolute;inset:-6px;border:3px dashed var(--tom);border-radius:22px;pointer-events:none}
.chead{display:flex;align-items:center;gap:8px;margin-top:3px}
.ico{width:36px;height:36px;border-radius:50%;background:var(--c);border:2.5px solid var(--ink);display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px}
.clab{font-weight:900;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;flex:1;min-width:0}
.clab small{display:block;font-weight:700;letter-spacing:0;text-transform:none;opacity:.6;font-size:11px}
.lock{width:38px;height:38px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;padding:0;flex:none}

.lock[aria-pressed=true]{background:var(--mari)}
.ctext{font-size:20px;font-weight:800;line-height:1.28;flex:1;overflow-wrap:anywhere}
.cfoot{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;align-items:center}
.chip{border:2px solid var(--ink);border-radius:99px;padding:0 8px;font-weight:800;background:#fff;white-space:nowrap}
.chip.cosy{background:var(--grass)}.chip.spicy{background:var(--tang)}.chip.chaotic{background:var(--grape);color:#fff}
.chip.day{background:var(--lav)}.chip.off{background:#fff;border-style:dashed}
.back{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background-color:var(--c);
  background-image:radial-gradient(#ffffff66 2px,transparent 2.5px),radial-gradient(#1A154018 2px,transparent 2.5px);background-size:18px 18px;background-position:0 0,9px 9px}
.back .blab{font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:1px 10px}
.reel{width:88%;height:2.3em;border:3px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden;position:relative;font-size:16px;font-weight:800;box-shadow:inset 0 6px 6px -4px #0003,inset 0 -6px 6px -4px #0003}
.strip{will-change:transform}
.strip div{height:2.3em;line-height:2.3em;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.card.spin .back{display:flex}
.card.spin .chead,.card.spin .ctext,.card.spin .cfoot{visibility:hidden}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;border:1.5px solid var(--ink);z-index:3}
.tile{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 #0006;min-width:0}
.tile .tl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;opacity:.75}
.code{font:800 19px/1.2 ui-monospace,Consolas,"Courier New",monospace;letter-spacing:.04em;overflow-wrap:anywhere;user-select:all}
.tile .note{font-size:12px;color:var(--mari)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:2.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:7px 12px;font-weight:800;font-size:14.5px;box-shadow:0 3px 0 var(--ink)}
.tile .btn{border-color:#fff;box-shadow:0 3px 0 #fff6}
.btn.pri{background:var(--grass)}
.btn.warn{background:var(--tom);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
/* panels for the other screens */
.panel{background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 5px 0 var(--ink);padding:16px;margin-bottom:16px}
h2{margin:6px 0 12px;font-size:22px}
.muted{opacity:.7;font-size:14px}
.runhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.daybox{display:flex;align-items:center;gap:8px}
.dayn{font-size:40px;font-weight:900;min-width:2.4ch;text-align:center;line-height:1}
.daylab{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.7;text-align:center}
.ring{width:64px;height:64px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;background:#fff;position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c)}
.item .box{flex:none;width:34px;height:34px;border-radius:10px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;padding:0;margin-left:6px}
.item .box svg{width:22px;height:22px;opacity:0}
.item.done .box{background:var(--grass)}
.item.done .box svg{opacity:1}
.item.done .itext{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.item .il{font-size:11.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.item .itext{font-weight:800}
.item .ih{font-size:13px;opacity:.7}
.item.sealed .itext{filter:blur(6px);user-select:none}
.item.due{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{background:#FFF3B0}}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.hrow{border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:#fff}
.hrow .hc{font:700 14px ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
.hbar{height:8px;border-radius:9px;background:#eee;border:1.5px solid var(--ink);overflow:hidden;max-width:220px}
.hbar i{display:block;height:100%;background:var(--grass)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cats button{border:2.5px solid var(--ink);border-radius:99px;padding:4px 12px;font-weight:800;background:#fff;font-size:14px}
.cats button[aria-pressed=true]{background:var(--c)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.addrow input{flex:1 1 220px;min-width:0;border:2.5px solid var(--ink);border-radius:12px;padding:7px 10px;background:#fff}
select{border:2.5px solid var(--ink);border-radius:12px;padding:6px 8px;background:#fff;font-weight:700}
.entries{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.entries li{display:flex;gap:8px;align-items:center;border-bottom:1.5px solid #1A154022;padding:4px 0}
.entries li span{flex:1;min-width:0;overflow-wrap:anywhere}
.entries select{font-size:13px;padding:3px 6px}
.x{width:32px;height:32px;border-radius:10px;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;padding:0;flex:none}
.x svg{width:16px;height:16px}
/* dialog, toast */
.veil{position:fixed;inset:0;background:#1A154099;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.veil.open{display:flex}
.dlg{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
.dlg h3{margin:0 0 10px;font-size:20px}
.dlg .big{font:900 24px/1.2 ui-monospace,Consolas,monospace;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px;text-align:center;overflow-wrap:anywhere;user-select:all;margin-bottom:10px}
.dlg input{width:100%;border:2.5px solid var(--ink);border-radius:12px;padding:9px 10px;font:800 18px ui-monospace,Consolas,monospace;text-transform:uppercase;margin-bottom:10px;background:#fff}
.dlg img{width:100%;max-width:260px;display:block;margin:0 auto 12px;border:2.5px solid var(--ink);border-radius:12px}
.msg{font-size:14px;margin:0 0 10px;padding:8px 10px;border-radius:10px;background:#fff;border:2px dashed var(--ink)}
.msg:empty{display:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;z-index:60;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:3px;border:1.5px solid var(--ink)}
.empty{text-align:center;padding:26px 10px}
/* phones */
@media (max-width:760px){
  header{padding:8px 12px;gap:8px}
  .logo{font-size:21px}
  nav{order:3;width:100%}
  .tab{flex:1;padding:6px 4px;font-size:14px;text-align:center}
  main{padding:0 12px 18px}
  .bar{gap:8px;flex-wrap:wrap}
  .knob,.knob svg{width:44px;height:44px}
  .seg button{padding:6px 9px;font-size:13px}
  .dealbtn{font-size:19px;padding:7px 16px}
  .dealbtn kbd,.hint{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cin{min-height:150px;padding:12px 10px 10px;gap:6px}
  .ctext{font-size:15px}
  .clab{font-size:11px}
  .ico{width:30px;height:30px}.ico svg{width:17px;height:17px}
  .lock{width:34px;height:34px}
  .tile{grid-column:1/-1}
  .reel{font-size:14px}
}
@media (max-width:360px){.seg button{padding:5px 6px;font-size:12px}}
/* preview: cards only, filling a 2:1 frame */
html.preview,html.preview body{height:100%;overflow:hidden}
.preview header,.preview .bar,.preview .tile,.preview .lock,.preview .toast,.preview .veil{display:none!important}
.preview main{padding:1.2vw;max-width:none;height:100%}
.preview #deal{height:100%}
.preview .grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:1fr 1fr;gap:1.4vw;height:100%}
.preview .cin{min-height:0;padding:1.6vw 1.6vw 1.2vw;gap:.8vw;border-width:2px;box-shadow:0 .7vw 0 var(--ink);border-radius:2.4vw}
.preview .cin::before{height:1.2vw}
.preview .ico{width:4.6vw;height:4.6vw;border-width:2px}.preview .ico svg{width:2.8vw;height:2.8vw}
.preview .clab{font-size:1.75vw}.preview .clab small{display:none}
.preview .ctext{font-size:2.3vw;line-height:1.22}
.preview .cfoot{font-size:1.6vw;gap:.6vw}.preview .chip{border-width:1.5px;padding:0 1vw}
.preview .reel{font-size:2.2vw;border-width:2px}.preview .back .blab{font-size:1.6vw}
.preview .stamp{display:flex}
.stamp{display:none;flex-direction:column;align-items:center;justify-content:center;gap:.6vw;border-radius:2.4vw;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:900;text-align:center}
.stamp b{font-size:3.4vw;letter-spacing:-.01em}.stamp span{font-size:1.9vw;padding:.2vw 1.4vw;border-radius:99px;border:1.5px solid #fff;color:var(--ink)}
@media (max-height:220px){.preview .cfoot{display:none}.preview .ctext{font-size:2.5vw}}
@media (prefers-reduced-motion:reduce){.needle,.toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="mark"><svg viewBox="0 0 24 24"><path class="ic" id="logoPath" d=""/></svg></span>Plot Twist</div>
  <nav role="tablist" aria-label="Screens">
    <button class="tab" role="tab" data-s="deal" aria-selected="true">Deal</button>
    <button class="tab" role="tab" data-s="play" aria-selected="false">Checklist</button>
    <button class="tab" role="tab" data-s="history" aria-selected="false">History</button>
    <button class="tab" role="tab" data-s="lists" aria-selected="false">My lists</button>
  </nav>
  <button class="iconbtn" id="mute" aria-pressed="false" aria-label="Mute sound (M)" title="Mute (M)"><svg viewBox="0 0 24 24"><path class="ic" id="muteIco" d=""/></svg></button>
</header>
<main>
  <section class="screen" id="deal">
    <div class="bar">
      <div class="dial" role="group" aria-label="Difficulty">
        <button class="knob" id="knob" aria-label="Turn the difficulty dial (D)" title="Difficulty (D)">
          <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="23" fill="#fff" stroke="#1A1540" stroke-width="3"/>
            <circle cx="12" cy="36" r="3" fill="#C6F432" stroke="#1A1540" stroke-width="1.5"/><circle cx="26" cy="8.5" r="3" fill="#FF8A3D" stroke="#1A1540" stroke-width="1.5"/><circle cx="40" cy="36" r="3" fill="#B45CF0" stroke="#1A1540" stroke-width="1.5"/>
            <g class="needle" id="needle"><circle cx="26" cy="26" r="13" id="knobFace" fill="#FF8A3D" stroke="#1A1540" stroke-width="2.5"/><line x1="26" y1="26" x2="26" y2="15" stroke="#1A1540" stroke-width="3.5" stroke-linecap="round"/></g></svg>
        </button>
        <div class="seg" id="seg"><button data-d="cosy" aria-pressed="false">Cosy</button><button data-d="spicy" aria-pressed="true">Spicy</button><button data-d="chaotic" aria-pressed="false">Chaotic</button></div>
      </div>
      <span class="hint">1 to 7 lock a card, D turns the dial</span>
      <button class="dealbtn" id="dealBtn"><svg viewBox="0 0 24 24"><path class="ic" id="dealIco" d=""/></svg>Deal <kbd>Space</kbd></button>
    </div>
    <div class="grid" id="grid"></div>
  </section>
  <section class="screen" id="play" hidden></section>
  <section class="screen" id="history" hidden></section>
  <section class="screen" id="lists" hidden></section>
</main>
<div class="veil" id="veil"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
// LOGIC-BEGIN
var PT = (function () {
  var DIFFS = ['cosy', 'spicy', 'chaotic'];
  var LETTER = { cosy: 'C', spicy: 'S', chaotic: 'X' };
  var FROM_LETTER = { C: 'cosy', S: 'spicy', X: 'chaotic' };
  // Which tags each dial position can deal, and how strongly. Weights shape the mix.
  var WEIGHTS = { cosy: { cosy: 1 }, spicy: { cosy: 1, spicy: 2 }, chaotic: { spicy: 1, chaotic: 2 } };
  var TWIST_DAYS = { cosy: [7, 14], spicy: [4, 10], chaotic: [2, 6] };
  var MAXLEN = 140;
  var CATS = [
    { id: 'budget', label: 'Budget', hint: 'Set it up at move-in', color: '#FFE066' },
    { id: 'household', label: 'Household', hint: 'Create them', color: '#22D3C5' },
    { id: 'rule', label: 'House rule', hint: 'Keep it all run', color: '#FF8A3D' },
    { id: 'career', label: 'Career', hint: 'Work in this job family', color: '#8C9BFF' },
    { id: 'personality', label: 'Play as', hint: 'Play them this way', color: '#FF7AC8' },
    { id: 'goal', label: 'Goal', hint: 'Reach it to finish', color: '#C6F432' },
    { id: 'twist', label: 'Twist', hint: 'Make it happen on its day', color: '#B9A8FF' }

      try { document.execCommand('copy') ? done() : toast('Select the code and copy it.'); } catch (e) { toast('Select the code and copy it.'); }
    };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, fallback); else fallback(); } catch (e) { fallback(); }
  }
  function openCodeDlg() {
    openDlg('<h3>Deal from a code</h3><p class="muted">Paste a share code to deal that exact run.</p><input id="codeIn" autocomplete="off" spellcheck="false" placeholder="S1A2B3C-K3F9Q" aria-label="Share code">' +
      '<p class="msg" id="codeMsg"></p><div class="btns" id="codeBtns"><button class="btn pri" id="codeGo">Deal it</button><button class="btn" id="codeNo">Cancel</button></div>', '#codeIn');
    $('codeGo').onclick = function () { tryCode($('codeIn').value); };
    $('codeNo').onclick = closeDlg;
    $('codeIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); tryCode($('codeIn').value); } });
  }
  function dealFromCode(spec, lists) {
    if (spin) finishSpin();
    cur.locks = CATS.map(function () { return false; });
    cur.cards = null;
    store.diff = spec.diff; paintDial();
    closeDlg(); show('deal'); showRun(spec, lists, true);
  }
  function tryCode(val) {
    var r = PT.resolveCode(val, curLists()), msg = $('codeMsg');
    if (r.status === 'bad') { msg.textContent = r.error; sfx.lock(false); return; }
    if (r.status === 'ok') { dealFromCode(r.spec, curLists()); toast('Dealt from the code.'); return; }
    var btns = $('codeBtns');
    if (r.status === 'defaults') {
      msg.textContent = 'This code was made with the default lists, and yours have been edited (version ' + r.yours + '), so your lists would deal a different run. Nothing was dealt.';
      btns.innerHTML = '<button class="btn pri" id="useDef">Deal it from the default lists</button><button class="btn" id="codeNo">Cancel</button>';
      $('useDef').onclick = function () { dealFromCode(r.spec, DEF); toast('Dealt from the default lists. Yours are unchanged.'); };
    } else {
      msg.textContent = 'This code was made with lists at version ' + r.ver + ', and yours are at version ' + r.yours + '. Dealing it here would give a different run, so nothing was dealt.';
      btns.innerHTML = '<button class="btn" id="anyway">Deal a different run anyway</button><button class="btn" id="codeNo">Cancel</button>';
      $('anyway').onclick = function () { dealFromCode(r.spec, curLists()); toast('Dealt with your lists: this is not the original run.'); };
    }
    $('codeNo').onclick = closeDlg;
    sfx.lock(false);
  }

  /* ---------- the checklist ---------- */
  function activeRun() { for (var i = 0; i < store.history.length; i++) if (store.history[i].id === store.activeId) return store.history[i]; return null; }
  function ring(done, total) {
    var r = 26, C = 2 * Math.PI * r, f = total ? done / total : 0;
    return '<svg class="ring" viewBox="0 0 64 64" aria-label="' + done + ' of ' + total + ' done"><circle cx="32" cy="32" r="' + r + '" fill="#fff" stroke="#1A154022" stroke-width="8"/>' +
      '<circle cx="32" cy="32" r="' + r + '" fill="none" stroke="#C6F432" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + (C * f).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 32 32)"/>' +
      '<circle cx="32" cy="32" r="' + (r + 5) + '" fill="none" stroke="#1A1540" stroke-width="2.5"/><text x="32" y="37" text-anchor="middle" font-size="15" font-weight="900" fill="#1A1540">' + done + '/' + total + '</text></svg>';
  }
  function renderPlay(flash) {
    var el = $('play'), run = activeRun();
    if (!run) {
      el.innerHTML = '<div class="panel empty"><h2>No run in play yet</h2><p class="muted">Deal a run and press Play this run, or open one from your history.</p><button class="btn pri" id="goDeal">Go to Deal</button></div>';
      $('goDeal').onclick = function () { show('deal'); };
      return;
    }
    var done = run.ticks.filter(Boolean).length, open = PT.twistOpen(run), tw = run.cards[NC - 1];
    var html = '<div class="panel"><div class="runhead">' + ring(done, NC) +
      '<div style="flex:1;min-width:150px"><h2 style="margin:0">Your ' + esc(run.diff) + ' run</h2><div class="muted">Code <b class="hc" style="font-family:ui-monospace,Consolas,monospace">' + esc(run.code) + '</b></div>' +
      '<div class="muted">' + (done === NC ? 'Run complete. Well played.' : open ? 'The twist has landed.' : 'The twist lands on day ' + tw.day + '.') + '</div></div>' +
      '<div class="daybox"><button class="btn" id="dayDown" aria-label="Previous day"' + (run.day <= 1 ? ' disabled' : '') + '>-</button><div><div class="daylab">Day</div><div class="dayn" id="dayN">' + run.day + '</div></div>' +
      '<button class="btn" id="dayUp" aria-label="Next day">+</button><button class="btn pri" id="nextDay">Next day</button></div></div></div>';
    html += '<ul class="checks">';
    run.cards.forEach(function (c, i) {
      var cat = CATS[i], sealed = i === NC - 1 && !open, on = run.ticks[i];
      html += '<li class="item' + (on ? ' done' : '') + (sealed ? ' sealed' : '') + (i === NC - 1 && flash ? ' due' : '') + '" style="--c:' + cat.color + '">' +
        '<button class="box" data-i="' + i + '" aria-pressed="' + on + '" aria-label="' + (on ? 'Untick ' : 'Tick ') + esc(cat.label) + '"' + (sealed ? ' disabled' : '') + '>' + svg('check') + '</button>' +
        '<div style="flex:1;min-width:0"><div class="il">' + esc(cat.label) + '</div><div class="itext">' + esc(sealed ? 'Something is on its way that will change everything' : c.text) + '</div>' +
        '<div class="ih">' + (sealed ? 'Sealed until day ' + c.day : esc(cat.hint) + (c.day ? ': day ' + c.day : '')) + '</div></div>' +
        (sealed ? '<button class="btn" id="peek">Peek</button>' : '') + '</li>';
    });
    html += '</ul><div class="btns" style="margin-top:14px"><button class="btn" id="plShare">Share this run</button><button class="btn" id="plPng">Download PNG card</button><button class="btn" id="plDeal">Deal another</button></div>';
    el.innerHTML = html;
    el.querySelectorAll('.box').forEach(function (b) { b.onclick = function () { tick(run, +b.dataset.i); }; });
    $('dayUp').onclick = $('nextDay').onclick = function () { setDay(run, run.day + 1); };
    $('dayDown').onclick = function () { setDay(run, run.day - 1); };
    if ($('peek')) $('peek').onclick = function () { run.peeked = true; save(); renderPlay(true); sfx.flip(); };
    $('plShare').onclick = function () { openShare(run); };
    $('plPng').onclick = function () { savePNG(run); };
    $('plDeal').onclick = function () { show('deal'); };
  }
  function tick(run, i) {
    run.ticks[i] = !run.ticks[i]; save(); sfx.check(run.ticks[i]);
    var all = run.ticks.every(Boolean);
    renderPlay();
    if (all && run.ticks[i]) { confetti(); sfx.fanfare(); toast('Run complete!'); }
  }
  function setDay(run, d) {
    d = Math.max(1, Math.min(9999, d)); if (d === run.day) return;
    var was = PT.twistOpen(run); run.day = d; save();
    var now = PT.twistOpen(run);
    if (!was && now) { renderPlay(true); sfx.twist(); toast('Plot twist! Day ' + d + ': ' + run.cards[NC - 1].text); }
    else { renderPlay(); sfx.day(); }
    if (!REDUCED && $('dayN').animate) $('dayN').animate([{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'cubic-bezier(.3,1.6,.5,1)' });
  }
  function confetti() {
    if (REDUCED) return;
    var layer = document.createElement('div'); layer.className = 'confetti'; document.body.appendChild(layer);
    var cols = ['#FFE066', '#FF4F6D', '#C6F432', '#22D3C5', '#B45CF0', '#FF7AC8', '#8C9BFF'];
    for (var k = 0; k < 60; k++) {
      var p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = cols[k % cols.length]; layer.appendChild(p);
      p.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: 'translate(' + (Math.random() * 160 - 80) + 'px,' + (innerHeight + 40) + 'px) rotate(' + (Math.random() * 900) + 'deg)' }], { duration: 1400 + Math.random() * 1200, delay: Math.random() * 400, easing: 'cubic-bezier(.3,.1,.6,1)', fill: 'forwards' });
    }
    setTimeout(function () { layer.remove(); }, 3200);
  }

  /* ---------- history, export and import ---------- */
  function renderHistory() {
    var el = $('history'), h = store.history;
    var html = '<div class="panel"><h2>History</h2><p class="muted">Runs you saved or played. They keep their own text, so editing your lists later never changes them.</p>' +
      '<div class="btns"><button class="btn" id="expBtn">Export runs and lists (.json)</button><button class="btn" id="impBtn">Import a .json file</button></div></div>';
    if (!h.length) html += '<div class="panel empty"><p class="muted">No saved runs yet. Deal one and press Save or Play this run.</p></div>';
    else {
      html += '<ul class="hist">';
      h.forEach(function (r, k) {
        var d = r.ticks.filter(Boolean).length;
        html += '<li class="hrow"><div style="min-width:0"><div><span class="chip ' + r.diff + '">' + r.diff + '</span> <b>' + esc(r.cards[4].text) + '</b></div>' +
          '<div class="muted">' + esc(new Date(r.createdAt || 0).toLocaleDateString()) + ', day ' + r.day + ', ' + d + ' of ' + NC + ' done' + (r.id === store.activeId ? ', in play' : '') + '</div>' +
          '<div class="hc">' + esc(r.code) + '</div><div class="hbar"><i style="width:' + Math.round(100 * d / NC) + '%"></i></div></div>' +
          '<div class="btns" style="justify-content:flex-end"><button class="btn pri" data-a="open" data-k="' + k + '">Open</button><button class="btn" data-a="png" data-k="' + k + '">PNG</button>' +
          '<button class="x" data-a="del" data-k="' + k + '" aria-label="Delete this run">' + svg('x') + '</button></div></li>';
      });
      html += '</ul>';
    }
    el.innerHTML = html;
    $('expBtn').onclick = exportJSON;
    $('impBtn').onclick = function () { $('importFile').value = ''; $('importFile').click(); };
    el.querySelectorAll('[data-a]').forEach(function (b) {
      b.onclick = function () {
        var r = store.history[+b.dataset.k]; if (!r) return;
        if (b.dataset.a === 'open') { store.activeId = r.id; save(); show('play'); }
        if (b.dataset.a === 'png') savePNG(r);
        if (b.dataset.a === 'del') confirmBox('Delete this run?', 'It leaves your history on this device. An exported .json file keeps a copy if you made one.', 'Delete', function () {
          store.history = store.history.filter(function (x) { return x !== r; });
          if (store.activeId === r.id) store.activeId = null;
          save(); renderHistory(); paintTile(); toast('Run deleted.');
        });
      };
    });
  }
  function exportJSON() {
    var data = { app: 'plot-twist', format: 1, exported: new Date().toISOString(), listVersion: PT.listVersion(curLists()), lists: curLists(), history: store.history };
    download(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), 'plot-twist-backup.json');
    toast('Backup downloaded.');
  }
  $('importFile').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var o; try { o = JSON.parse(String(rd.result)); } catch (e) { toast('That file is not valid JSON.'); return; }
      if (!o || o.app !== 'plot-twist') { toast('That file is not a Plot Twist backup.'); return; }
      var added = 0;
      if (Array.isArray(o.history)) {
        var have = {}; store.history.forEach(function (r) { have[r.id] = true; });
        o.history.map(PT.sanitizeRun).filter(Boolean).forEach(function (r) { if (!have[r.id]) { store.history.push(r); have[r.id] = true; added++; } });
        store.history.sort(function (a, b) { return b.createdAt - a.createdAt; });
        store.history = store.history.slice(0, 100);
      }
      var sl = o.lists ? PT.sanitizeLists(o.lists) : null;
      if (sl) setLists(sl.lists); else save();
      renderHistory(); paintTile();
      toast('Imported ' + added + ' run' + (added === 1 ? '' : 's') + (sl ? ' and your lists (version ' + PT.listVersion(curLists()) + ')' : '') + '.');
    };
    rd.readAsText(f);
  });

  /* ---------- My lists ---------- */
  var listCat = 0;
  function renderLists() {
    var el = $('lists'), L = curLists(), cat = CATS[listCat], list = L[cat.id], v = PT.listVersion(L);
    var counts = { cosy: 0, spicy: 0, chaotic: 0 }; list.forEach(function (e) { counts[e.tag]++; });
    var html = '<div class="panel"><h2>My lists</h2><p class="muted">Every card is dealt from these lists. List version <b id="verOut">' + v + '</b>' + (v === DEF_VER ? ' (the defaults)' : ' (edited)') +
      '. Share codes carry this version, so a code made before an edit warns instead of dealing something different.</p><div class="cats">';
    CATS.forEach(function (c, i) { html += '<button style="--c:' + c.color + '" data-c="' + i + '" aria-pressed="' + (i === listCat) + '">' + esc(c.label) + ' ' + L[c.id].length + '</button>'; });
    html += '</div><div class="muted">' + list.length + ' entries: ' + counts.cosy + ' cosy, ' + counts.spicy + ' spicy, ' + counts.chaotic + ' chaotic.</div>' +
      '<div class="addrow"><input id="newEntry" maxlength="' + PT.MAXLEN + '" placeholder="Add your own ' + esc(cat.label.toLowerCase()) + ' entry" aria-label="New entry">' +
      '<select id="newTag" aria-label="Difficulty tag"><option value="cosy">cosy</option><option value="spicy" selected>spicy</option><option value="chaotic">chaotic</option></select>' +
      '<button class="btn pri" id="addEntry">Add</button></div><ul class="entries">';
    list.forEach(function (e, k) {
      html += '<li><span>' + esc(e.t) + '</span><select data-k="' + k + '" aria-label="Tag">' + PT.DIFFS.map(function (d) { return '<option' + (d === e.tag ? ' selected' : '') + '>' + d + '</option>'; }).join('') + '</select>' +
        '<button class="x" data-rm="' + k + '" aria-label="Remove entry"' + (list.length <= 1 ? ' disabled title="A list needs at least one entry"' : '') + '>' + svg('x') + '</button></li>';
    });
    html += '</ul><div class="btns" style="margin-top:12px"><button class="btn" id="resetOne">Reset this list to defaults</button><button class="btn warn" id="resetAll">Reset all lists</button></div></div>';
    el.innerHTML = html;
    el.querySelectorAll('[data-c]').forEach(function (b) { b.onclick = function () { listCat = +b.dataset.c; renderLists(); }; });
    function edit(fn) { var l = PT.cloneLists(curLists()); fn(l[cat.id]); setLists(l); renderLists(); paintTile(); }
    function add() {
      var t = PT.cleanText($('newEntry').value);
      if (!t) { toast('Type an entry first.'); return; }
      if (list.some(function (e) { return e.t.toLowerCase() === t.toLowerCase(); })) { toast('That entry is already on the list.'); return; }
      var tag = $('newTag').value;
      edit(function (a) { a.unshift({ t: t, tag: tag }); }); sfx.check(true); toast('Added. List version is now ' + PT.listVersion(curLists()) + '.');
      $('newEntry').focus();
    }
    $('addEntry').onclick = add;
    $('newEntry').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    el.querySelectorAll('select[data-k]').forEach(function (s) { s.onchange = function () { var k = +s.dataset.k; edit(function (a) { a[k].tag = s.value; }); }; });
    el.querySelectorAll('[data-rm]').forEach(function (b) { b.onclick = function () { var k = +b.dataset.rm; edit(function (a) { if (a.length > 1) a.splice(k, 1); }); sfx.soft(); }; });
    $('resetOne').onclick = function () { confirmBox('Reset ' + cat.label + '?', 'This list goes back to the ' + DEF[cat.id].length + ' default entries.', 'Reset', function () { edit(function (a) { a.length = 0; DEF[cat.id].forEach(function (e) { a.push({ t: e.t, tag: e.tag }); }); }); toast(cat.label + ' reset.'); }); };
    $('resetAll').onclick = function () { confirmBox('Reset all lists?', 'Every list goes back to the defaults. Saved runs keep their own text.', 'Reset all', function () { setLists(PT.cloneLists(DEF)); renderLists(); paintTile(); toast('All lists reset to defaults.'); }); };
  }

  /* ---------- keyboard ---------- */
  function typingIn(t) { var n = t && t.tagName; return n === 'INPUT' || n === 'TEXTAREA' || n === 'SELECT' || (t && t.isContentEditable); }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeDlg(); return; } // never preventDefault or stop Escape: the host page listens for it
    if (e.ctrlKey || e.metaKey || e.altKey || typingIn(e.target)) return;
    if (e.key === 'm' || e.key === 'M') { toggleMute(); return; }
    if (dlgOpen || screen !== 'deal') return;
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); if (!e.repeat) deal(); return; }
    if (/^[1-7]$/.test(e.key)) { toggleLock(+e.key - 1); return; }
    if (e.key === 'd' || e.key === 'D') { cycleDiff(); return; }
    if (e.key === 'Enter' && (e.target === document.body || !e.target)) deal();
  });
  document.addEventListener('keyup', function (e) {
    if ((e.key === ' ' || e.code === 'Space') && screen === 'deal' && !dlgOpen && !typingIn(e.target)) e.preventDefault();
  });

  /* ---------- hooks for the tests, then start ---------- */
  var api = window.__pt = { PT: PT, store: store, deals: 0, get cur() { return cur; }, get spinning() { return !!spin; }, get screen() { return screen; }, deal: deal, finishSpin: finishSpin, drawPNG: drawPNG, preview: PREVIEW };

  if (PREVIEW) {
    document.documentElement.classList.add('preview');
    document.body.classList.add('preview');
    var n = 0;
    var loop = function () {
      n++;
      store.diff = PT.DIFFS[n % 3];
      // every third deal, keep one card locked so the demo shows a re-roll around it
      cur.locks = CATS.map(function () { return false; });
      if (cur.cards && n % 3 === 0) cur.locks[Math.floor(Math.random() * NC)] = true;
      deal();
      setTimeout(loop, 4300);
    };
    setTimeout(loop, 250);
  } else {
    deal();
    if (activeRun() && location.hash === '#play') show('play');
  }
})();
</script>
</body>
</html>

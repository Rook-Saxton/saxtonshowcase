<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wobble Yard</title>
<style>
:root{
  color-scheme: light;
  --paper:#efe6ff;
  --yard:#f8f3ff;
  --yard-dot:#e3d6fb;
  --ink:#2b2140;
  --ink-soft:#5b4d7c;
  --white:#fffdf9;
  --pink:#ff8cc6;      --pink-deep:#d95a9c;
  --mint:#6fdcbc;      --mint-deep:#2fae8a;
  --sky:#7cc6ff;       --sky-deep:#3f8fd6;
  --lemon:#ffdc5e;     --lemon-deep:#d9a91f;
  --tangerine:#ffa55a; --tangerine-deep:#d9772b;
  --grape:#b89dff;     --grape-deep:#7e5fd6;
  --coral:#ff7f7f;     --coral-deep:#d94f5a;
  --lime:#a9e36a;      --lime-deep:#6fae2f;
  --wood:#ffc983;      --wood-deep:#d4924a;
  --ground:#a8e6a1;    --ground-deep:#6cc46a;
  --cheek:#ff9fb8;
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Varela Round", "Trebuchet MS", system-ui, sans-serif;
}
html,body{height:100%;margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.top{
  display:flex;align-items:center;gap:10px;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 10px calc(12px + env(safe-area-inset-left,0px));
  touch-action:manipulation;
}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:800;
  font-size:clamp(18px,4.6vw,30px);letter-spacing:.3px;white-space:nowrap}
.brand span{overflow:hidden;text-overflow:ellipsis}
.brand svg{width:40px;height:40px;flex:0 0 auto}
.utils{display:flex;gap:8px;flex:0 0 auto}
#yard{
  position:relative;flex:1;min-height:0;
  margin:0 calc(12px + env(safe-area-inset-right,0px)) 0 calc(12px + env(safe-area-inset-left,0px));
  border:3px solid var(--ink);border-radius:22px;overflow:hidden;
  background:var(--yard);
  box-shadow:0 6px 0 var(--grape-deep);
  touch-action:none;
}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hint{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);
  max-width:calc(100% - 24px);box-sizing:border-box;
  background:var(--white);border:3px solid var(--ink);border-radius:999px;
  padding:6px 14px;font-weight:800;font-size:15px;line-height:1.2;text-align:center;
  box-shadow:0 4px 0 var(--grape);
  pointer-events:none;opacity:0;transition:opacity .25s;
}
.hint.show{opacity:1}
.toolbar{
  padding:12px calc(8px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px));
}
.scroller{
  display:flex;align-items:flex-start;gap:10px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  touch-action:pan-x;overscroll-behavior-x:contain;
  padding:4px 4px 10px;scrollbar-width:none;
}
.scroller::-webkit-scrollbar{display:none}
.group{display:flex;gap:10px;flex:0 0 auto}
.divider{flex:0 0 4px;align-self:stretch;margin:6px 2px 14px;border-radius:4px;background:var(--ink);opacity:.25}
.btn{
  appearance:none;-webkit-appearance:none;font:inherit;color:var(--ink);
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-width:66px;min-height:66px;padding:6px 8px 6px;box-sizing:border-box;
  background:var(--white);border:3px solid var(--ink);border-radius:18px;
  box-shadow:0 5px 0 var(--sh,var(--grape-deep));
  cursor:pointer;touch-action:manipulation;
  transition:transform .08s ease, box-shadow .08s ease, background-color .12s;
}
.btn svg{width:34px;height:34px;display:block;overflow:visible}
.btn span{font-size:12.5px;font-weight:800;line-height:1;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh,var(--grape-deep))}
.btn[aria-pressed="true"]{background:var(--on,var(--lemon));transform:translateY(2px);box-shadow:0 3px 0 var(--sh,var(--grape-deep))}
.btn:focus{outline:none}
.btn:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
.btn.small{min-width:56px;min-height:56px;padding:4px 6px;border-radius:16px}
.btn.small svg{width:28px;height:28px}
.btn.small span{font-size:11.5px}
.btn.confirm{background:var(--coral);animation:wig .5s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.c-pink{--sh:var(--pink-deep);--on:var(--pink)}
.c-mint{--sh:var(--mint-deep);--on:var(--mint)}
.c-sky{--sh:var(--sky-deep);--on:var(--sky)}
.c-lemon{--sh:var(--lemon-deep);--on:var(--lemon)}
.c-tangerine{--sh:var(--tangerine-deep);--on:var(--tangerine)}
.c-grape{--sh:var(--grape-deep);--on:var(--grape)}
.c-coral{--sh:var(--coral-deep);--on:var(--coral)}
.c-lime{--sh:var(--lime-deep);--on:var(--lime)}
.c-wood{--sh:var(--wood-deep);--on:var(--wood)}
.ico *{stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.ico .dot{stroke:none;fill:var(--ink)}
.fn{fill:none}.fw{fill:var(--white)}.fp{fill:var(--pink)}.fm{fill:var(--mint)}.fs{fill:var(--sky)}
.fl{fill:var(--lemon)}.ft{fill:var(--tangerine)}.fg{fill:var(--grape)}.fc{fill:var(--coral)}
.fli{fill:var(--lime)}.fwd{fill:var(--wood)}
#mute .xmark{display:none}
#mute[aria-pressed="true"] .xmark{display:inline}
#mute[aria-pressed="true"] .wave{display:none}
@media (max-width:480px){
  .brand svg{display:none}
  .brand{white-space:normal;line-height:1.02;font-size:20px}
  .utils{gap:6px}
  .top{gap:6px}
}
@media (max-height:520px){
  .top{padding-top:calc(4px + env(safe-area-inset-top,0px));padding-bottom:6px}
  .btn{min-width:56px;min-height:52px;padding:3px 6px}
  .btn svg{width:26px;height:26px}
  .btn.small{min-width:50px;min-height:48px}
  .btn.small svg{width:22px;height:22px}
  .toolbar{padding-top:8px}
}
@media (prefers-reduced-motion: reduce){
  .btn,.hint{transition:none}
  .btn.confirm{animation:none}
}
/* ?preview=1: the yard alone, playing itself, for the showcase's small frame */
html.preview .top,html.preview .toolbar,html.preview .hint{display:none}
html.preview #yard{margin:0;border:0;border-radius:0;box-shadow:none}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><rect class="fp" x="12" y="17" width="16" height="20" rx="8"/><circle class="fp" cx="20" cy="11" r="8"/><circle class="dot" cx="17" cy="10.5" r="1.5"/><circle class="dot" cx="23" cy="10.5" r="1.5"/></svg>
      <span>Wobble Yard</span>
    </div>
    <div class="utils">
      <button class="btn small c-sky" id="grav" type="button" aria-label="Gravity is Earth. Tap to change.">
        <svg class="ico" viewBox="0 0 40 40" aria-hidden="true" id="gravIcon"></svg><span id="gravLabel">Earth</span>
      </button>
      <button class="btn small c-lime" id="slow" type="button" aria-pressed="false" aria-label="Slow motion">
        <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><path class="fm" d="M4 33 Q4 29 9 29 H27 L32 17 L35 18 L33 33 Z"/><circle class="fl" cx="18" cy="21" r="9"/><path class="fn" d="M18 21 m-4 0 a4 4 0 1 1 4 4"/><path class="fn" d="M32 17 L30 11 M34 18 L36 12"/></svg><span>Slow</span>
      </button>
      <button class="btn small c-grape" id="mute" type="button" aria-pressed="false" aria-label="Sound off">
        <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><path class="fg" d="M6 15 H12 L20 8 V32 L12 25 H6 Z"/><path class="fn wave" d="M25 15 Q29 20 25 25 M29 11 Q36 20 29 29"/><path class="fn xmark" d="M25 15 L34 25 M34 15 L25 25"/></svg><span>Sound</span>
      </button>
      <button class="btn small c-coral" id="clear" type="button" aria-label="Clear everything">
        <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><path class="fn" d="M31 4 L20 20"/><path class="fl" d="M15 18 L25 24 L21 36 Q12 35 6 28 Z"/><path class="fn" d="M11 30 L17 24 M16 34 L21 26"/></svg><span id="clearLabel">Clear</span>
      </button>
    </div>
  </header>

  <main id="yard" aria-label="Play yard">
    <canvas id="stage" role="img" aria-label="Wobble Yard: a play yard of bouncy jelly wobblies, crates, balls and balloons"></canvas>
    <div id="hint" class="hint" aria-live="polite"></div>
  </main>

  <nav class="toolbar" aria-label="Tools and things to drop">
    <div class="scroller" id="scroller">
      <div class="group" role="group" aria-label="Tools">
        <button class="btn c-lemon" type="button" data-tool="grab" aria-pressed="true">
          <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><rect class="fl" x="11" y="7" width="6" height="17" rx="3"/><rect class="fl" x="17" y="4" width="6" height="19" rx="3"/><rect class="fl" x="23" y="7" width="6" height="17" rx="3"/><rect class="fl" x="4" y="18" width="6" height="13" rx="3" transform="rotate(-38 7 24)"/><rect class="fl" x="9" y="16" width="22" height="19" rx="8"/></svg><span>Grab</span>
        </button>
        <button class="btn c-coral" type="button" data-tool="pin" aria-pressed="false">
          <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><path class="fn" d="M20 27 L20 37"/><ellipse class="fc" cx="20" cy="25" rx="10" ry="3.5"/><rect class="fc" x="16" y="15" width="8" height="10"/><circle class="fc" cx="20" cy="11" r="8"/></svg><span>Pin</span>
        </button>
        <button class="btn c-pink" type="button" data-tool="erase" aria-pressed="false">
          <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(-35 20 20)"><rect class="fp" x="5" y="13" width="15" height="14" rx="3"/><rect class="fs" x="20" y="13" width="15" height="14" rx="3"/></g><path class="fn" d="M9 36 H31"/></svg><span>Eraser</span>
        </button>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="group" role="group" aria-label="Things to drop">
        <button class="btn c-grape" type="button" data-spawn="wobbly" data-name="wobbly" aria-pressed="false">
          <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><path class="fn" d="M14 25 L8 30 M26 25 L32 30 M17 34 L16 38 M23 34 L24 38"/><rect class="fg" x="13" y="17" width="14" height="19" rx="7"/><circle class="fg" cx="20" cy="11" r="8"/><circle class="dot" cx="17" cy="10.5" r="1.5"/><circle class="dot" cx="23" cy="10.5" r="1.5"/></svg><span>Wobbly</span>
        </button>
        <button class="btn c-tangerine" type="button" data-spawn="crate" data-name="crate" aria-pressed="false">
          <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><rect class="ft" x="6" y="6" width="28" height="28" rx="4"/><rect class="fn" x="11" y="11" width="18" height="18" rx="2"/><path class="fn" d="M11 29 L29 11"/></svg><span>Crate</span>
        </button>
        <button class="btn c-sky" type="button" data-spawn="ball" data-name="bouncy ball" aria-pressed="false">
          <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><circle class="fs" cx="20" cy="20" r="14"/><path class="fn" d="M7 16 Q20 25 33 16"/><path class="fn" d="M8 26 Q20 33 32 26" style="stroke-width:2"/></svg><span>Ball</span>
        </button>
        <button class="btn c-coral" type="button" data-spawn="balloon" data-name="balloon" aria-pressed="false">
          <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><path class="fn" d="M20 29 Q15 33 20 35 Q24 37 19 40"/><path class="fc" d="M17 30 H23 L20 26 Z"/><ellipse class="fc" cx="20" cy="15" rx="11" ry="13"/><path class="fn" d="M14 10 Q15 7 18 6" style="stroke:var(--white)"/></svg><span>Balloon</span>
        </button>
        <button class="btn c-mint" type="button" data-spawn="tramp" data-name="trampoline" aria-pressed="false">
          <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><path class="fn" d="M11 18 L14 21 L10 24 L14 27 M20 18 L23 21 L19 24 L23 27 M29 18 L32 21 L28 24 L32 27"/><rect class="fg" x="5" y="27" width="30" height="8" rx="3"/><rect class="fp" x="3" y="11" width="34" height="8" rx="4"/></svg><span>Trampoline</span>
        </button>
        <button class="btn c-wood" type="button" data-spawn="plank" data-name="plank" aria-pressed="false">
          <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(-20 20 20)"><rect class="fwd" x="2" y="15" width="36" height="10" rx="4"/><path class="fn" d="M8 20 H18 M23 20 H32" style="stroke-width:2"/></g></svg><span>Plank</span>
        </button>
        <button class="btn c-sky" type="button" data-spawn="fan" data-name="fan" aria-pressed="false">
          <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><rect class="fg" x="12" y="30" width="10" height="6" rx="2"/><rect class="fs" x="3" y="6" width="28" height="26" rx="7"/><circle class="fw" cx="17" cy="19" r="9"/><path class="fn" d="M17 19 L17 12 M17 19 L23 22 M17 19 L11 22"/><path class="fn" d="M33 13 H38 M34 19 H39 M33 25 H38"/></svg><span>Fan</span>
        </button>
        <button class="btn c-pink" type="button" data-spawn="bomb" data-name="boing bomb" aria-pressed="false">
          <svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><path class="fn" d="M20 13 L24 11 L16 9 L24 7 L18 5"/><circle class="fl" cx="18" cy="4" r="2.8"/><circle class="fp" cx="20" cy="25" r="12"/><circle class="dot" cx="16.5" cy="23.5" r="1.6"/><circle class="dot" cx="23.5" cy="23.5" r="1.6"/><path class="fn" d="M17 28 Q20 31 23 28"/></svg><span>Boing bomb</span>
        </button>
      </div>
    </div>
  </nav>
</div>

<script>
(function () {
  'use strict';

  // ?preview=1 hides the bars, stays silent and plays a hands-free demo.
  var PREVIEW = /[?&]preview=/.test(location.search);
  if (PREVIEW) document.documentElement.classList.add('preview');

  /* ---------- tokens and helpers ---------- */
  var rootStyle = getComputedStyle(document.documentElement);
  function tok(n, f) { var v = rootStyle.getPropertyValue(n).trim(); return v || f; }
  var C = {
    ink: tok('--ink', '#2b2140'), yard: tok('--yard', '#f8f3ff'), dot: tok('--yard-dot', '#e3d6fb'),
    white: tok('--white', '#fffdf9'), ground: tok('--ground', '#a8e6a1'), groundDeep: tok('--ground-deep', '#6cc46a'),
    pink: tok('--pink', '#ff8cc6'), mint: tok('--mint', '#6fdcbc'), sky: tok('--sky', '#7cc6ff'),
    lemon: tok('--lemon', '#ffdc5e'), tangerine: tok('--tangerine', '#ffa55a'), grape: tok('--grape', '#b89dff'),
    coral: tok('--coral', '#ff7f7f'), lime: tok('--lime', '#a9e36a'), wood: tok('--wood', '#ffc983'),
    woodDeep: tok('--wood-deep', '#d4924a'), cheek: tok('--cheek', '#ff9fb8'), grapeDeep: tok('--grape-deep', '#7e5fd6')
  };
  var CANDY = [C.pink, C.mint, C.sky, C.lemon, C.tangerine, C.grape, C.coral, C.lime];
  var FONT = 'ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Varela Round", system-ui, sans-serif';

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function pickOne(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function mix(a, b, t) {
    var pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    var r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t);
    var g = Math.round(((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t);
    var bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  var rmq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  function reduced() { return !!(rmq && rmq.matches); }

  /* ---------- canvas and sizing ---------- */
  var yard = document.getElementById('yard');
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var bg = document.createElement('canvas');
  var bgx = bg.getContext('2d');
  var W = 0, H = 0, DPR = 1, U = 1, floorY = 0, started = false;
  var GROUND_H = 22, LW = 3;

  /* ---------- world state ---------- */
  var particles = [];
  var things = [];
  var ropes = [];
  var fx = [];
  var grabs = new Map();
  var nextId = 1, simTime = 0;
  var GRAVS = [
    { name: 'Earth', g: 1500 },
    { name: 'Moon', g: 260 },
    { name: 'Float', g: 0 }
  ];
  var gMode = 0, slow = false, muted = false;
  var FRAME = 1 / 60, SUB = 5, ITER = 2;
  var MAX_THINGS = 60, MAX_PARTS = 480;
  var MAXPUSH = 6, MAXV = 2600, GRAB_K = 0.3;

  // wobbly skeleton: x, y, radius, mass (in units of U)
  var WOB = [
    [0, -46, 16, 1.2],   // 0 head
    [0, -18, 14, 2],     // 1 chest
    [0, 8, 14, 2],       // 2 pelvis
    [-17, -8, 7, 0.45],  // 3 left elbow
    [-22, 12, 7, 0.4],   // 4 left hand
    [17, -8, 7, 0.45],   // 5 right elbow
    [22, 12, 7, 0.4],    // 6 right hand
    [-8, 30, 8, 0.6],    // 7 left knee
    [-9, 52, 8, 0.55],   // 8 left foot
    [8, 30, 8, 0.6],     // 9 right knee
    [9, 52, 8, 0.55]     // 10 right foot
  ];
  var WSTICKS = [
    [0, 1, 1], [1, 2, 1], [0, 2, 0.5],
    [1, 3, 1], [3, 4, 1], [1, 5, 1], [5, 6, 1],
    [2, 7, 1], [7, 8, 1], [2, 9, 1], [9, 10, 1],
    [2, 8, 0.03], [2, 10, 0.03], [7, 9, 0.02], [1, 4, 0.01], [1, 6, 0.01]
  ];
  var WOB_MASS = 0;
  for (var wi = 0; wi < WOB.length; wi++) WOB_MASS += WOB[wi][3];

  /* ---------- thing construction ---------- */
  function newThing(type, extra) {
    var t = { id: nextId++, type: type, parts: [], sticks: [], rest: null, rigidK: 1, angle: 0,
      pinned: false, isStatic: false, born: simTime, u: U };
    if (extra) for (var k in extra) t[k] = extra[k];
    things.push(t);
    return t;
  }
  function addP(t, x, y, r, m, e, mu) {
    var p = { x: x, y: y, px: x, py: y, vx: 0, vy: 0, ovx: 0, ovy: 0, r: r, m: m, w: 1 / m,
      thing: t, e: e, mu: mu, balloon: false, head: false };
    t.parts.push(p); particles.push(p);
    return p;
  }
  function addS(t, a, b, k) { t.sticks.push({ a: a, b: b, L: Math.hypot(b.x - a.x, b.y - a.y), k: k }); }
  function makeRigid(t, k) {
    var cx = 0, cy = 0, n = t.parts.length, i;
    for (i = 0; i < n; i++) { cx += t.parts[i].x; cy += t.parts[i].y; }
    cx /= n; cy /= n;
    t.rest = [];
    for (i = 0; i < n; i++) t.rest.push({ x: t.parts[i].x - cx, y: t.parts[i].y - cy });
    t.rigidK = k; t.angle = 0;
  }

  function makeWobbly(x, y, color) {
    var u = U;
    color = color || pickOne(CANDY);
    var t = newThing('wobbly', { color: color, limb: mix(color, C.ink, 0.2), shine: mix(color, C.white, 0.55),
      wide: 0, seed: Math.random() * 10 });
    for (var i = 0; i < WOB.length; i++) {
      var d = WOB[i];
      addP(t, x + d[0] * u, y + d[1] * u, d[2] * u, d[3], 0.12, 0.7);
    }
    t.parts[0].head = true;
    for (var j = 0; j < WSTICKS.length; j++) {
      var s = WSTICKS[j];
      addS(t, t.parts[s[0]], t.parts[s[1]], s[2]);
    }
    return t;

      for (var j = 0; j < particles.length; j++) {
        var p = particles[j];
        p.x = clamp(p.x, p.r, Math.max(p.r, W - p.r)); p.y = clamp(p.y, p.r, Math.max(p.r, floorY - p.r));
        p.px = p.x; p.py = p.y;
      }
    }
    if (!started) { started = true; setupScene(); }
    render();
  }

  function setupScene() {
    var fl = floorY, u = U;
    makeTramp(W * 0.24, fl - 15 * u);
    makeWobbly(W * 0.24, Math.max(70 * u, fl - 330 * u), C.pink);
    var s = 56 * u, cx = W * 0.76;
    makeCrate(cx - s * 0.56, fl - s / 2 - 1);
    makeCrate(cx + s * 0.56, fl - s / 2 - 1);
    makeCrate(cx, fl - s * 1.5 - 2);
    makeWobbly(cx, fl - s * 2 - 62 * u, C.mint);
    var w3 = makeWobbly(W * 0.5, fl - 62 * u, C.sky);
    makeBalloon(0, 0, w3.parts[6]);
    makeBall(W * 0.4, fl - 26 * u);
  }

  /* ---------- UI: tools, spawning, hint ---------- */
  var tool = 'grab', armed = null;
  var hintEl = document.getElementById('hint'), hintTimer = 0;
  var toolBtns = Array.prototype.slice.call(document.querySelectorAll('[data-tool]'));
  var spawnBtns = Array.prototype.slice.call(document.querySelectorAll('[data-spawn]'));

  function showHint(text, ms) {
    hintEl.textContent = text;
    hintEl.classList.add('show');
    clearTimeout(hintTimer);
    if (ms) hintTimer = setTimeout(function () { hintEl.classList.remove('show'); }, ms);
  }
  function refreshButtons() {
    toolBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(!armed && b.dataset.tool === tool)); });
    spawnBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(armed === b.dataset.spawn)); });
  }
  function setTool(name) {
    tool = name; armed = null; refreshButtons();
    if (name === 'grab') showHint('Drag and fling anything!', 2200);
    else if (name === 'pin') showHint('Tap a thing to pin it. Tap again to let go.', 0);
    else showHint('Tap or rub things to poof them away.', 0);
  }
  toolBtns.forEach(function (b) { b.addEventListener('click', function () { setTool(b.dataset.tool); sfx('click'); }); });
  spawnBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var type = b.dataset.spawn;
      if (armed === type) {
        spawnAt(type, W / 2 + rand(-20, 20), Math.min(H * 0.3, floorY - 80 * U));
      } else {
        armed = type; refreshButtons();
        showHint('Tap the yard to drop a ' + b.dataset.name + '!', 0);
        sfx('click');
      }
    });
  });

  function spawnAt(type, x, y) {
    var m = 34 * U, t = null;
    x = clamp(x, m, W - m); y = clamp(y, m, floorY - m);
    switch (type) {
      case 'wobbly': t = makeWobbly(x, clamp(y, 64 * U, floorY - 62 * U)); break;
      case 'crate': t = makeCrate(x, y); break;
      case 'ball': t = makeBall(x, y); break;
      case 'plank': t = makePlank(clamp(x, 90 * U, W - 90 * U), y); break;
      case 'bomb': t = makeBomb(x, y); break;
      case 'tramp': t = makeTramp(x, y); break;
      case 'fan': t = makeFan(x, y); break;
      case 'balloon': {
        var hit = pick(x, y, 22 * U + 10, function (p) { return !p.balloon; });
        t = makeBalloon(x, y, hit && hit.p ? hit.p : null);
        if (hit && hit.p) showHint('Tied on! Up it goes!', 1600);
        break;
      }
    }
    if (t) { enforceCap(t); sfx('plip'); }
    return t;
  }

  function pick(x, y, slop, filter) {
    var best = null, bd = slop;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (filter && !filter(p)) continue;
      var d = Math.hypot(p.x - x, p.y - y) - p.r;
      if (d < bd) { bd = d; best = p; }
    }
    if (best) return { thing: best.thing, p: best };
    for (var j = things.length - 1; j >= 0; j--) {
      var t = things[j];
      if (!t.isStatic) continue;
      if (Math.abs(x - t.x) <= t.w / 2 + slop * 0.5 && Math.abs(y - t.y) <= t.h / 2 + slop * 0.5) return { thing: t, p: null };
    }
    return null;
  }

  function setPinned(t, on) {
    if (t.isStatic) return;
    t.pinned = on;
    for (var i = 0; i < t.parts.length; i++) {
      var p = t.parts[i];
      p.w = on ? 0 : 1 / p.m; p.vx = p.vy = 0; p.px = p.x; p.py = p.y;
    }
  }
  function moveThing(t, dx, dy) {
    if (t.isStatic) {
      t.x += dx; t.y += dy; t.grounded = t.y + t.h / 2 > floorY - 4; clampStatic(t);
      return;
    }
    for (var i = 0; i < t.parts.length; i++) {
      var p = t.parts[i];
      p.x = clamp(p.x + dx, p.r, W - p.r); p.y = clamp(p.y + dy, p.r, floorY - p.r); p.px = p.x; p.py = p.y;
    }
  }

  /* ---------- pointer input (multi-touch) ---------- */
  var pointers = new Map();
  function localXY(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    initAudio();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    var q = localXY(e);
    if (armed) { spawnAt(armed, q.x, q.y); return; }
    if (tool === 'grab') {
      var hit = pick(q.x, q.y, 24);
      if (!hit) return;
      var t = hit.thing;
      if (t.isStatic || t.pinned) {
        grabs.set(e.pointerId, { kin: true, thing: t, p: null, lx: q.x, ly: q.y, sx: q.x, sy: q.y, t0: performance.now() });
      } else {
        var p = hit.p, ox = q.x - p.x, oy = q.y - p.y, ol = Math.hypot(ox, oy);
        if (ol > p.r) { ox *= p.r / ol; oy *= p.r / ol; }
        grabs.set(e.pointerId, { kin: false, thing: t, p: p, ox: ox, oy: oy, tx: p.x, ty: p.y, sx: q.x, sy: q.y, t0: performance.now() });
      }
    } else if (tool === 'pin') {
      var hp = pick(q.x, q.y, 20);
      if (hp && !hp.thing.isStatic) { setPinned(hp.thing, !hp.thing.pinned); sfx('click'); }
    } else if (tool === 'erase') {
      pointers.set(e.pointerId, 'erase');
      var he = pick(q.x, q.y, 12);
      if (he) removeThing(he.thing, true);
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    var q = localXY(e);
    if (pointers.get(e.pointerId) === 'erase') {
      var he = pick(q.x, q.y, 8);
      if (he) removeThing(he.thing, true);
      return;
    }
    var g = grabs.get(e.pointerId);
    if (!g) return;
    e.preventDefault();
    if (g.kin) { moveThing(g.thing, q.x - g.lx, q.y - g.ly); g.lx = q.x; g.ly = q.y; }
    else {
      g.tx = clamp(q.x - g.ox, g.p.r, W - g.p.r);
      g.ty = clamp(q.y - g.oy, g.p.r, floorY - g.p.r);
    }
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    var g = grabs.get(e.pointerId);
    if (!g) return;
    var q = localXY(e);
    if (g.kin && g.thing.type === 'fan' && Math.hypot(q.x - g.sx, q.y - g.sy) < 8 && performance.now() - g.t0 < 400) {
      g.thing.dir *= -1; sfx('click');
    }
    grabs.delete(e.pointerId);
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('lostpointercapture', endPointer);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  ['touchstart', 'touchmove'].forEach(function (n) {
    yard.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  yard.addEventListener('dblclick', function (e) { e.preventDefault(); });
  document.addEventListener('pointerdown', initAudio, true);
  document.addEventListener('touchend', initAudio, true);

  /* ---------- top bar buttons ---------- */
  var ICONS = {
    Earth: '<circle class="fs" cx="20" cy="20" r="14"/><path class="fm" d="M10 15 Q15 10 19 14 Q21 19 16 21 Q11 22 10 15 Z M22 25 Q27 22 31 25 Q29 31 24 31 Q21 28 22 25 Z"/>',
    Moon: '<path class="fl" d="M25 5 A15 15 0 1 0 35 27 A12 12 0 0 1 25 5 Z"/><circle class="fn" cx="15" cy="20" r="2.5"/><circle class="fn" cx="21" cy="29" r="2"/>',
    Float: '<path class="fw" d="M10 30 A6 6 0 0 1 10 19 A8 8 0 0 1 25 15 A7 7 0 0 1 31 30 Z"/><path class="fn" d="M20 12 V4 M16 8 L20 4 L24 8"/>'
  };
  var gravBtn = document.getElementById('grav'), gravIcon = document.getElementById('gravIcon'), gravLabel = document.getElementById('gravLabel');
  function showGrav() {
    var n = GRAVS[gMode].name;
    gravIcon.innerHTML = ICONS[n]; gravLabel.textContent = n;
    gravBtn.setAttribute('aria-label', 'Gravity is ' + n + '. Tap to change.');
  }
  gravBtn.addEventListener('click', function () {
    gMode = (gMode + 1) % GRAVS.length; showGrav(); sfx('boing');
    showHint(['Earth gravity: things fall fast.', 'Moon gravity: big floaty hops!', 'Float mode: everything drifts.'][gMode], 1800);
  });
  var slowBtn = document.getElementById('slow');
  slowBtn.addEventListener('click', function () {
    slow = !slow; slowBtn.setAttribute('aria-pressed', String(slow)); sfx('click');
    showHint(slow ? 'Slow motion on.' : 'Normal speed.', 1400);
  });
  var muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', function () {
    muted = !muted; initAudio();
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.setAttribute('aria-label', muted ? 'Sound on' : 'Sound off');
    muteBtn.querySelector('span').textContent = muted ? 'Muted' : 'Sound';
    if (master) master.gain.value = muted ? 0 : 0.45;
  });
  var clearBtn = document.getElementById('clear'), clearLabel = document.getElementById('clearLabel'), clearTimer = 0, clearArmed = false;
  function disarmClear() {
    clearArmed = false; clearBtn.classList.remove('confirm'); clearLabel.textContent = 'Clear';
    clearBtn.setAttribute('aria-label', 'Clear everything');
  }
  clearBtn.addEventListener('click', function () {
    if (!clearArmed) {
      clearArmed = true; clearBtn.classList.add('confirm'); clearLabel.textContent = 'Sure?';
      clearBtn.setAttribute('aria-label', 'Tap again to clear everything');
      showHint('Tap Sure? to clear the yard.', 2600);
      clearTimeout(clearTimer); clearTimer = setTimeout(disarmClear, 3000);
      return;
    }
    clearTimeout(clearTimer); disarmClear();
    var shown = 0;
    for (var i = things.length - 1; i >= 0; i--) {
      var c = centerOf(things[i]);
      if (shown++ < 14) addPoof(c.x, c.y, 26 * U);
    }
    things.length = 0; particles.length = 0; ropes.length = 0; grabs.clear();
    sfx('poof'); showHint('All clean! Drop something new.', 2000);
  });
  showGrav();

  /* ---------- preview demo: drops, flings and bombs on a loop, then a fresh yard ---------- */
  var DEMO = ['wobbly', 'ball', 'fling', 'balloon', 'crate', 'bomb', 'fling', 'wobbly', 'ball', 'fling', 'bomb', 'plank'];
  var demoT = 0, demoN = 0, demoAge = 0, demoLoops = 0;
  function demo(dt) {
    demoT += dt; demoAge += dt;
    if (demoAge > 36 || things.length > 26) { demoReset(); return; }
    if (demoT < 1.4) return;
    demoT = 0;
    var k = DEMO[demoN++ % DEMO.length];
    var wobs = things.filter(function (t) { return t.type === 'wobbly' && !t.pinned; });
    if (k === 'fling') {
      if (!wobs.length) return;
      var t = pickOne(wobs), dir = t.parts[0].x < W / 2 ? 1 : -1, vx = dir * rand(450, 700), vy = -rand(700, 950) * Math.sqrt(U);
      for (var i = 0; i < t.parts.length; i++) { t.parts[i].vx += vx; t.parts[i].vy += vy; }
      t.wide = 0.6;
    } else if (k === 'balloon') {
      var free = wobs.filter(function (w) { return !ropes.some(function (r) { return r.b.thing === w; }); });
      if (free.length && ropes.length < 2) makeBalloon(0, 0, pickOne(free).parts[6]);
    } else if (k === 'bomb') {
      var at = wobs.length ? centerOf(pickOne(wobs)) : { x: W / 2, y: floorY };
      spawnAt('bomb', at.x + rand(-30, 30) * U, at.y - 90 * U);
    } else {
      spawnAt(k, rand(W * 0.15, W * 0.85), rand(H * 0.08, H * 0.22));
    }
  }
  function demoReset() {
    for (var i = 0; i < things.length && i < 14; i++) { var c = centerOf(things[i]); addPoof(c.x, c.y, 26 * U); }
    things.length = 0; particles.length = 0; ropes.length = 0; grabs.clear();
    setupScene();
    demoT = 0; demoAge = 0; demoLoops++;
  }

  /* ---------- main loop: fixed timestep ---------- */
  var last = performance.now(), acc = 0;
  function loop(now) {
    var dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now; acc += dt;
    var n = 0, scale = slow ? 0.3 : 1;
    while (acc >= FRAME && n < 4) {
      if (W > 1) {
        var h = FRAME * scale / SUB;
        for (var s = 0; s < SUB; s++) step(h);
        tick(FRAME * scale);
      }
      acc -= FRAME; n++;
    }
    if (n === 4) acc = 0;
    if (W > 1) render();
    requestAnimationFrame(loop);
  }

  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(yard);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  resize();
  refreshButtons();
  showHint('Drag and fling the wobblies!', 3000);
  requestAnimationFrame(loop);

  // read-only peek for automated checks
  window.wobbleYard = {
    stats: function () { return { things: things.length, particles: particles.length, ropes: ropes.length, W: W, H: H, floorY: floorY,
      gravity: GRAVS[gMode].name, slow: slow, muted: muted, audio: AC ? AC.state : null, preview: PREVIEW, demoLoops: demoLoops, simTime: simTime }; },
    list: function () { return things.map(function (t) { var c = centerOf(t); return { id: t.id, type: t.type, x: c.x, y: c.y, pinned: t.pinned }; }); }
  };
})();
</script>
</body>
</html>

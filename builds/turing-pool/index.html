<!--
  TURING POOL - a Gray-Scott reaction-diffusion pool you can paint into.
  Playground build, 2026-09-07. Self-contained, offline, no dependencies.

  WHAT IT IS
  Two imaginary chemicals share a square of water that wraps at every edge. U is
  fed in everywhere and V eats it, turning one unit of U into more of itself, and
  V drains away a little faster than it is made. That is the whole rule, four
  terms long, and it has no notion of a spot, a stripe, a worm or a leaf. Drag on
  the pool to drop V in and watch which of those it decides to become. The little
  map in the panel is the parameter plane: click anywhere in it to change what
  kind of thing the water wants to grow.

  WHY I BUILT IT
  Not for the chemistry. The four previous playground builds are all "explain a
  mechanism by making it steppable", which had quietly become a house style, and
  the playtime log says in as many words that it was worth breaking on purpose
  once. So this one is meant to be pleasant first and instructive second.

  The thing I actually did not know how to write was the substrate: GPGPU in
  WebGL2. Ping-ponging a pair of RGBA32F textures through a framebuffer, reading
  float pixels back out, and using the fragment shader as a grid of tiny
  processors instead of as a thing that draws. I could describe all of that and
  had never once typed it, which is the exact shape of a thing I do not know.

  WHAT IT TAUGHT ME
  - The simulation lives in the texture's colour channels: R is U, G is V, and
    the "image" is never looked at by a person. The screen pass is a separate,
    throwaway shader on the end.
  - NEAREST filtering on the state texture is not a preference. I assumed
    LINEAR would be the subtle kind of wrong, quietly averaging neighbouring
    cells into every tap while the picture carried on looking plausible. It is
    not subtle at all: measured, on headless Chromium, switching the state
    textures to LINEAR takes a field whose total is exactly 1.0 to a field of
    exactly zeros in a single step, even though the browser reports
    OES_texture_float_linear as present. I have not established why it returns
    nothing rather than a filtered value, so that is where the knowledge stops.
  - gl.REPEAT is what makes the pool a torus, for free, in hardware. The wrap
    that costs an index-modulo branch per tap on the CPU costs nothing here.
  - Texture space runs bottom-up and canvas space runs top-down, so painting
    with a mouse needs a Y flip that nothing warns you about, because the
    unflipped version looks completely fine until you notice the pattern grows
    away from the cursor.

  HOW IT IS CHECKED
  Every number in the Prove it panel is a closed form derived from the equations
  rather than from this code, and the panel runs the comparison live, in front of
  you, on a scratch pool. The same checks run headless in
  ../_verify/check_turing.js, with the predictions written down before any of it
  was measured in ../_verify/PREDICTIONS_turing-pool.md.

  Nothing here leaves the machine. No network, no storage, no data of any kind.
-->

<script>
"use strict";
/* ------------------------------------------------------------------ *
 * THE MODEL. Written once, here, and shared by both implementations.
 *
 *   du/dt = Du * lap(u) - u v^2 + F (1 - u)
 *   dv/dt = Dv * lap(v) + u v^2 - (F + k) v
 *
 * lap is the 9 point kernel below, on a torus. Stepping is explicit Euler
 * with dt = 1. Nothing is clamped inside the step: an unstable choice of
 * parameters is allowed to blow up in the open, because a silent clamp is
 * a lie that makes a broken simulation look fine. The display pass clamps
 * for colour only.
 * ------------------------------------------------------------------ */
const MODEL = { diag: 0.05, orth: 0.2, centre: -1.0, dt: 1.0 };
const DEFAULTS = { F: 0.0362, k: 0.0625, Du: 0.2097, Dv: 0.105 };

/* The homogeneous steady states, solved rather than simulated. Setting both
 * derivatives to zero with a flat field gives (F+k)v^2 - Fv + F(F+k) = 0,
 * which is real only where F + k <= sqrt(F)/2. Returns null outside that. */
function homogeneousStates(F, k) {
  const a = F + k, disc = F * F - 4 * a * a * F;
  if (disc < 0) return null;
  const r = Math.sqrt(disc);
  return [+1, -1].map(s => { const v = (F + s * r) / (2 * a); return { u: a / v, v }; });
}
const boundaryK = F => Math.sqrt(F) / 2 - F;   // top edge of that region

/* ------------------------------------------------------------------ *
 * PALETTES. Defined as stops in JavaScript and baked into a 256 entry
 * ramp, so the GPU path (which uploads the ramp as a texture) and the CPU
 * path (which indexes the same array) cannot drift apart on colour.
 * ------------------------------------------------------------------ */
const PALETTES = {
  ember: [[0.00, 6, 8, 16], [0.28, 46, 22, 58], [0.52, 156, 47, 62],
          [0.74, 240, 126, 46], [0.90, 253, 214, 130], [1.00, 255, 250, 238]],
  opal:  [[0.00, 9, 12, 30], [0.25, 44, 34, 96], [0.50, 42, 122, 150],
          [0.74, 106, 209, 186], [0.90, 208, 244, 226], [1.00, 255, 255, 252]],
  moss:  [[0.00, 8, 14, 11], [0.30, 22, 54, 38], [0.55, 63, 116, 55],
          [0.78, 148, 179, 78], [0.93, 226, 231, 168], [1.00, 252, 253, 240]],
  ink:   [[0.00, 247, 245, 238], [0.30, 178, 187, 196], [0.58, 84, 106, 130],
          [0.80, 30, 44, 66], [1.00, 6, 9, 16]],
  bone:  [[0.00, 10, 10, 12], [0.45, 92, 92, 100], [0.80, 196, 197, 202], [1.00, 255, 255, 255]],
};
function rampOf(name) {
  const stops = PALETTES[name], out = new Uint8Array(256 * 4);
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let a = stops[0], b = stops[stops.length - 1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (t >= stops[s][0] && t <= stops[s + 1][0]) { a = stops[s]; b = stops[s + 1]; break; }
    }
    const span = b[0] - a[0], f = span <= 0 ? 0 : (t - a[0]) / span;
    out[i * 4 + 0] = Math.round(a[1] + (b[1] - a[1]) * f);
    out[i * 4 + 1] = Math.round(a[2] + (b[2] - a[2]) * f);
    out[i * 4 + 2] = Math.round(a[3] + (b[3] - a[3]) * f);
    out[i * 4 + 3] = 255;
  }
  return out;
}

/* ------------------------------------------------------------------ *
 * SHARED HELPERS for building an initial state. A state is one
 * Float32Array of length w*h*4 laid out RGBA, R = u, G = v, so it can be
 * handed straight to texImage2D or read straight by the CPU stepper.
 * ------------------------------------------------------------------ */
function blankState(w, h, u = 1, v = 0) {
  const s = new Float32Array(w * h * 4);
  for (let i = 0; i < w * h; i++) { s[i * 4] = u; s[i * 4 + 1] = v; s[i * 4 + 3] = 1; }
  return s;
}
function mulberry32(seed) {           // small deterministic PRNG, so a seed reproduces
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededState(w, h, seed, blobs = 14) {
  const s = blankState(w, h), rnd = mulberry32(seed);
  for (let b = 0; b < blobs; b++) {
    const cx = Math.floor(rnd() * w), cy = Math.floor(rnd() * h);
    const r = 3 + Math.floor(rnd() * 7);
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r) continue;
      const x = ((cx + dx) % w + w) % w, y = ((cy + dy) % h + h) % h, i = (y * w + x) * 4;
      s[i] = 0.5; s[i + 1] = 0.25;
    }
  }
  return s;
}

/* ================================================================== *
 * CPU BACKEND. The reference implementation, in double precision.
 *
 * It has two jobs and it matters that they are the same code: it is the
 * fallback for a browser with no WebGL2, and it is the second opinion the
 * Prove it panel measures the GPU against. A reference that is only ever
 * run by the test is a reference nobody has exercised.
 * ================================================================== */
class CpuSim {
  constructor(w, h) {
    this.w = w; this.h = h; this.kind = "cpu";
    this.u = new Float64Array(w * h); this.v = new Float64Array(w * h);
    this.nu = new Float64Array(w * h); this.nv = new Float64Array(w * h);
    this.steps = 0;
    this.upload(blankState(w, h));
  }
  upload(state) {
    for (let i = 0; i < this.w * this.h; i++) { this.u[i] = state[i * 4]; this.v[i] = state[i * 4 + 1]; }
    this.steps = 0;
  }
  read() {
    const s = new Float32Array(this.w * this.h * 4);
    for (let i = 0; i < this.w * this.h; i++) { s[i * 4] = this.u[i]; s[i * 4 + 1] = this.v[i]; s[i * 4 + 3] = 1; }
    return s;
  }
  step(n, p) {
    const { w, h } = this, { diag, orth, centre, dt } = MODEL;
    const u = this.u, v = this.v, nu = this.nu, nv = this.nv;
    for (let it = 0; it < n; it++) {
      for (let y = 0; y < h; y++) {
        const yn = ((y - 1) + h) % h, ys = (y + 1) % h;
        for (let x = 0; x < w; x++) {
          const xw = ((x - 1) + w) % w, xe = (x + 1) % w;
          const c = y * w + x;
          const lu = orth * (u[y * w + xw] + u[y * w + xe] + u[yn * w + x] + u[ys * w + x])
                   + diag * (u[yn * w + xw] + u[yn * w + xe] + u[ys * w + xw] + u[ys * w + xe])
                   + centre * u[c];
          const lv = orth * (v[y * w + xw] + v[y * w + xe] + v[yn * w + x] + v[ys * w + x])
                   + diag * (v[yn * w + xw] + v[yn * w + xe] + v[ys * w + xw] + v[ys * w + xe])
                   + centre * v[c];
          const uvv = u[c] * v[c] * v[c];
          nu[c] = u[c] + dt * (p.Du * lu - uvv + p.F * (1 - u[c]));
          nv[c] = v[c] + dt * (p.Dv * lv + uvv - (p.F + p.k) * v[c]);
        }
      }
      u.set(nu); v.set(nv);
      this.steps++;
    }
  }
  paint(cx, cy, radius, uSet, vSet) {   // cx, cy in cells; wraps
    const { w, h } = this, r2 = radius * radius;
    const R = Math.ceil(radius);
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
      const d2 = dx * dx + dy * dy;
      if (d2 > r2) continue;
      const t = 1 - Math.sqrt(d2) / radius;
      const wgt = t * t * (3 - 2 * t);
      const x = (((cx + dx) | 0) % w + w) % w, y = (((cy + dy) | 0) % h + h) % h, i = y * w + x;
      this.u[i] += (uSet - this.u[i]) * wgt;
      this.v[i] += (vSet - this.v[i]) * wgt;
    }
  }
  dispose() {}
}

/* ================================================================== *
 * GPU BACKEND. WebGL2, two RGBA32F textures ping-ponged through two
 * framebuffers. R holds u, G holds v; nobody ever looks at this texture
 * as a picture. The display pass is a separate shader on the end.
 * ================================================================== */
const VERT = `#version 300 es
in vec2 a_pos;
out vec2 v_uv;
void main() { v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const STEP_FRAG = `#version 300 es
precision highp float;
uniform sampler2D u_state;
uniform vec2 u_texel;
uniform float u_F, u_k, u_Du, u_Dv, u_dt;
uniform float u_diag, u_orth, u_centre;
in vec2 v_uv;
out vec4 outColor;
void main() {
  vec2 c = texture(u_state, v_uv).rg;
  // Wrapping is gl.REPEAT on the texture, so a tap past the edge costs
  // nothing. This is the whole reason a torus is free on the GPU.
  vec2 lap =
      u_orth * ( texture(u_state, v_uv + vec2(-u_texel.x, 0.0)).rg
               + texture(u_state, v_uv + vec2( u_texel.x, 0.0)).rg
               + texture(u_state, v_uv + vec2(0.0, -u_texel.y)).rg
               + texture(u_state, v_uv + vec2(0.0,  u_texel.y)).rg )
    + u_diag * ( texture(u_state, v_uv + vec2(-u_texel.x, -u_texel.y)).rg
               + texture(u_state, v_uv + vec2( u_texel.x, -u_texel.y)).rg
               + texture(u_state, v_uv + vec2(-u_texel.x,  u_texel.y)).rg
               + texture(u_state, v_uv + vec2( u_texel.x,  u_texel.y)).rg )
    + u_centre * c;
  float u = c.r, v = c.g;
  float uvv = u * v * v;
  float nu = u + u_dt * (u_Du * lap.r - uvv + u_F * (1.0 - u));
  float nv = v + u_dt * (u_Dv * lap.g + uvv - (u_F + u_k) * v);
  outColor = vec4(nu, nv, 0.0, 1.0);
}`;

const PAINT_FRAG = `#version 300 es
precision highp float;
uniform sampler2D u_state;
uniform vec2 u_centre;      // in texture coords
uniform vec2 u_radius;      // radius in texture coords, per axis
uniform vec2 u_set;         // (u, v) to paint toward
in vec2 v_uv;
out vec4 outColor;
void main() {
  vec2 c = texture(u_state, v_uv).rg;
  vec2 d = abs(v_uv - u_centre);
  d = min(d, 1.0 - d);                  // shortest way round the torus
  float r = length(d / u_radius);
  float w = 1.0 - smoothstep(0.0, 1.0, r);
  outColor = vec4(mix(c, u_set, w), 0.0, 1.0);
}`;

const DRAW_FRAG = `#version 300 es
precision highp float;
uniform sampler2D u_state;
uniform sampler2D u_ramp;
uniform vec2 u_texel;
uniform vec2 u_scale;      // maps the square pool onto a non-square canvas
uniform float u_lo, u_hi, u_relief;
in vec2 v_uv;
out vec4 outColor;
float shade(vec2 p) { return clamp((texture(u_state, p).g - u_lo) / (u_hi - u_lo), 0.0, 1.0); }
void main() {
  vec2 p = (v_uv - 0.5) * u_scale + 0.5;   // REPEAT tiles the torus outside [0,1]
  float t = shade(p);
  float g = pow(t, 0.78);
  vec3 col = texture(u_ramp, vec2(g, 0.5)).rgb;
  if (u_relief > 0.5) {
    float dx = shade(p + vec2(u_texel.x, 0.0)) - shade(p - vec2(u_texel.x, 0.0));
    float dy = shade(p + vec2(0.0, u_texel.y)) - shade(p - vec2(0.0, u_texel.y));
    vec3 n = normalize(vec3(-dx * 5.0, -dy * 5.0, 1.0));
    float lam = clamp(dot(n, normalize(vec3(-0.45, 0.55, 0.75))), 0.0, 1.0);
    col *= 0.72 + 0.55 * lam;
    col += 0.10 * pow(lam, 14.0);
  }
  outColor = vec4(col, 1.0);
}`;

/* Is the GPU path actually available? Asked on a throwaway canvas, before
 * anything touches the real one. A canvas can only ever hold one kind of
 * context, so probing by trying to build the real thing and catching the
 * failure leaves the visible canvas permanently unable to fall back to 2D.
 * That is not hypothetical: it is the bug the interface suite found. */
function gpuAvailable() {
  try {
    const gl = document.createElement("canvas").getContext("webgl2");
    if (!gl || !gl.getExtension("EXT_color_buffer_float")) return false;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 4, 4, 0, gl.RGBA, gl.FLOAT, null);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    const ext = gl.getExtension("WEBGL_lose_context");
    if (ext) ext.loseContext();
    return ok;
  } catch (e) { return false; }
}

class GpuSim {
  constructor(w, h, canvas) {
    this.w = w; this.h = h; this.kind = "gpu"; this.steps = 0;
    this.ownsCanvas = !canvas;
    this.canvas = canvas || document.createElement("canvas");
    const gl = this.canvas.getContext("webgl2", {
      antialias: false, depth: false, stencil: false,
      // The storybook index reads pixels out of every build's canvas to prove
      // the preview actually painted. A WebGL canvas can be cleared by the
      // compositor between the draw and that read unless the buffer is kept.
      preserveDrawingBuffer: true, premultipliedAlpha: false,
    });
    if (!gl) throw new Error("no webgl2");
    if (!gl.getExtension("EXT_color_buffer_float")) throw new Error("no EXT_color_buffer_float");
    this.gl = gl;

    this.progStep = this._program(VERT, STEP_FRAG);
    this.progPaint = this._program(VERT, PAINT_FRAG);
    this.progDraw = this._program(VERT, DRAW_FRAG);

    // one full screen triangle, shared by all three programs
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.vao = vao;

    this._allocate();
    this.ramp = gl.createTexture();
    this.setPalette("ember");
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.upload(blankState(w, h));
  }
  _allocate() {
    const gl = this.gl;
    this.tex = [this._stateTex(), this._stateTex()];
    this.fbo = this.tex.map(t => {
      const f = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
        throw new Error("float framebuffer incomplete");
      }
      return f;
    });
    this.src = 0;
  }
  /* Change grid size WITHOUT throwing the context away. Rebuilding the whole
   * GpuSim on the visible canvas was the bug: a lost context cannot be
   * recreated on the same canvas, so the second size change fell off the GPU
   * path silently and then found a null 2D context waiting for it. */
  resize(w, h) {
    const gl = this.gl;
    this.tex.forEach(t => gl.deleteTexture(t));
    this.fbo.forEach(f => gl.deleteFramebuffer(f));
    this.w = w; this.h = h;
    this._allocate();
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.upload(blankState(w, h));
  }
  _shader(type, src) {
    const gl = this.gl, s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  _program(vs, fs) {
    const gl = this.gl, p = gl.createProgram();
    gl.attachShader(p, this._shader(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, this._shader(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, "a_pos");
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) {
      const n = gl.getActiveUniform(p, i).name;
      u[n] = gl.getUniformLocation(p, n);
    }
    return { p, u };
  }
  _stateTex() {
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, this.w, this.h, 0, gl.RGBA, gl.FLOAT, null);
    // NEAREST is a correctness requirement, not a taste. LINEAR quietly
    // averages neighbouring cells into every tap and the simulation carries
    // on looking plausible while solving a different equation.
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);   // the torus
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    return t;
  }
  setPalette(name) {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.ramp);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, rampOf(name));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  upload(state) {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.tex[this.src]);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, this.w, this.h, gl.RGBA, gl.FLOAT, state);
    this.steps = 0;
  }
  read() {
    const gl = this.gl, out = new Float32Array(this.w * this.h * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo[this.src]);
    gl.readPixels(0, 0, this.w, this.h, gl.RGBA, gl.FLOAT, out);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return out;
  }
  _pass(prog, setUniforms, dstFbo, vw, vh) {
    const gl = this.gl;
    gl.useProgram(prog.p);
    gl.bindVertexArray(this.vao);
    gl.bindFramebuffer(gl.FRAMEBUFFER, dstFbo);
    gl.viewport(0, 0, vw, vh);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.tex[this.src]);
    gl.uniform1i(prog.u.u_state, 0);
    setUniforms(gl, prog.u);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  step(n, p) {
    const gl = this.gl;
    for (let i = 0; i < n; i++) {
      this._pass(this.progStep, (g, u) => {
        g.uniform2f(u.u_texel, 1 / this.w, 1 / this.h);
        g.uniform1f(u.u_F, p.F); g.uniform1f(u.u_k, p.k);
        g.uniform1f(u.u_Du, p.Du); g.uniform1f(u.u_Dv, p.Dv);
        g.uniform1f(u.u_dt, MODEL.dt);
        g.uniform1f(u.u_diag, MODEL.diag); g.uniform1f(u.u_orth, MODEL.orth);
        g.uniform1f(u.u_centre, MODEL.centre);
      }, this.fbo[1 - this.src], this.w, this.h);
      this.src = 1 - this.src;         // the ping-pong: never read and write one texture
      this.steps++;
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  paint(cx, cy, radius, uSet, vSet) {
    const gl = this.gl;
    this._pass(this.progPaint, (g, u) => {
      g.uniform2f(u.u_centre, (cx + 0.5) / this.w, (cy + 0.5) / this.h);
      g.uniform2f(u.u_radius, radius / this.w, radius / this.h);
      g.uniform2f(u.u_set, uSet, vSet);
    }, this.fbo[1 - this.src], this.w, this.h);
    this.src = 1 - this.src;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  draw(cw, ch, opts) {
    const gl = this.gl;
    gl.useProgram(this.progDraw.p);
    gl.bindVertexArray(this.vao);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, cw, ch);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.tex[this.src]);
    gl.uniform1i(this.progDraw.u.u_state, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, this.ramp);
    gl.uniform1i(this.progDraw.u.u_ramp, 1);
    const s = coverScale(cw, ch);
    gl.uniform2f(this.progDraw.u.u_scale, s.x, s.y);
    gl.uniform2f(this.progDraw.u.u_texel, 1 / this.w, 1 / this.h);
    gl.uniform1f(this.progDraw.u.u_lo, opts.lo);
    gl.uniform1f(this.progDraw.u.u_hi, opts.hi);
    gl.uniform1f(this.progDraw.u.u_relief, opts.relief ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  dispose() {
    // Only a scratch pool on its own canvas may throw its context away. Doing
    // this to the visible canvas is unrecoverable, because a canvas keeps the
    // one context kind it was first given for the rest of its life.
    if (!this.ownsCanvas) return;
    const ext = this.gl.getExtension("WEBGL_lose_context");
    if (ext) ext.loseContext();
  }
}

/* The square pool covers a rectangular canvas by scaling the short axis to
 * exactly one tile. Anything past the edge wraps, which is seamless because
 * the domain genuinely is a torus, so a wide screen shows the same water
 * continued rather than a border. */
function coverScale(cw, ch) {
  return cw >= ch ? { x: cw / ch, y: 1 } : { x: 1, y: ch / cw };
}

/* ------------------------------------------------------------------ *
 * The CPU renderer, used when there is no WebGL2. Same ramp, same
 * mapping, same relief, written against a 2D context.
 * ------------------------------------------------------------------ */
function drawCpu(sim, ctx, cw, ch, opts) {
  const { w, h } = sim, ramp = rampOf(opts.palette);
  const img = ctx.createImageData(w, h);
  const d = img.data, lo = opts.lo, hi = opts.hi;
  const shade = i => Math.max(0, Math.min(1, (sim.v[i] - lo) / (hi - lo)));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    const g = Math.pow(shade(i), 0.78);
    const idx = Math.max(0, Math.min(255, Math.round(g * 255))) * 4;
    let r = ramp[idx], gg = ramp[idx + 1], b = ramp[idx + 2];
    if (opts.relief) {
      const xe = (x + 1) % w, xw = (x - 1 + w) % w, ys = (y + 1) % h, yn = (y - 1 + h) % h;
      const dx = shade(y * w + xe) - shade(y * w + xw);
      const dy = shade(ys * w + x) - shade(yn * w + x);
      const nx = -dx * 5, ny = -dy * 5, nl = Math.hypot(nx, ny, 1);
      const lam = Math.max(0, (nx * -0.45 + ny * 0.55 + 0.75) / nl);
      const m = 0.72 + 0.55 * lam, sp = 0.10 * Math.pow(lam, 14) * 255;
      r = Math.min(255, r * m + sp); gg = Math.min(255, gg * m + sp); b = Math.min(255, b * m + sp);
    }
    const o = i * 4;
    d[o] = r; d[o + 1] = gg; d[o + 2] = b; d[o + 3] = 255;
  }
  const off = drawCpu._off || (drawCpu._off = document.createElement("canvas"));
  off.width = w; off.height = h;
  off.getContext("2d").putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const s = coverScale(cw, ch);
  // mirror the GPU's cover-and-tile so both backends frame the pool the same way
  const tileW = cw / s.x, tileH = ch / s.y;
  for (let ty = -1; ty <= Math.ceil(ch / tileH); ty++) {
    for (let tx = -1; tx <= Math.ceil(cw / tileW); tx++) {
      ctx.drawImage(off, (cw - tileW) / 2 + tx * tileW, (ch - tileH) / 2 + ty * tileH, tileW, tileH);
    }
  }
}

/* ================================================================== *
 * THE PAGE

const qs = new URLSearchParams(location.search);
const PREVIEW = qs.has("preview");
if (PREVIEW) document.documentElement.classList.add("preview");

let poolCanvas = document.getElementById("pool");
const params = { ...DEFAULTS };
const view = { palette: "ember", relief: true, lo: 0.02, hi: 0.36, speed: 14, brush: 11, grid: 256 };
let sim = null, running = true, ctx2d = null, backendNote = "";

function makeSim(grid) {
  if (sim && sim.kind === "gpu") { sim.resize(grid, grid); return sim; }
  if (sim && sim.kind === "cpu") { sim = new CpuSim(grid, grid); return sim; }

  if (gpuAvailable()) {
    try {
      sim = new GpuSim(grid, grid, poolCanvas);
      backendNote = "";
      sim.setPalette(view.palette);
      return sim;
    } catch (e) {
      backendNote = String(e.message || e);
    }
  } else {
    backendNote = "WebGL2 with float render targets is unavailable";
  }
  // Fail loud, not silent: the page says which path it took and why.
  sim = new CpuSim(grid, grid);
  ctx2d = poolCanvas.getContext("2d");
  if (!ctx2d) {
    // The canvas already holds a WebGL context from a construction that got
    // partway and then failed, so it can never give us a 2D one. Swap in a
    // fresh element and re-bind, rather than leaving a dead pool on screen.
    const fresh = document.createElement("canvas");
    fresh.id = "pool";
    poolCanvas.replaceWith(fresh);
    poolCanvas = fresh;
    bindPointer(poolCanvas);
    ctx2d = poolCanvas.getContext("2d");
  }
  const boxEl = document.getElementById("fallback");
  boxEl.style.display = "block";
  boxEl.textContent = "No WebGL2 float textures here (" + backendNote +
    "). Running the JavaScript reference instead: same equations, smaller and slower.";
  return sim;
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(poolCanvas.clientWidth * dpr));
  const h = Math.max(1, Math.round(poolCanvas.clientHeight * dpr));
  if (poolCanvas.width !== w || poolCanvas.height !== h) { poolCanvas.width = w; poolCanvas.height = h; }
}

function render() {
  resize();
  if (sim.kind === "gpu") sim.draw(poolCanvas.width, poolCanvas.height, view);
  else drawCpu(sim, ctx2d, poolCanvas.width, poolCanvas.height, view);
}

let raf = 0;
function frame() {
  if (running) sim.step(view.speed, params);
  render();
  raf = requestAnimationFrame(frame);
}

/* ---------- painting. The Y flip lives here and nowhere else. ---------- */
function canvasToCell(ev) {
  const r = poolCanvas.getBoundingClientRect();
  const fx = (ev.clientX - r.left) / r.width, fy = (ev.clientY - r.top) / r.height;
  const s = coverScale(r.width, r.height);
  let tx = (fx - 0.5) * s.x + 0.5;
  let ty = (fy - 0.5) * s.y + 0.5;
  tx = ((tx % 1) + 1) % 1; ty = ((ty % 1) + 1) % 1;
  // Canvas Y runs down the screen and texture Y runs up it. Everything the
  // pointer does has to be flipped exactly once, here, or the pattern grows
  // in a mirror of where the cursor is and it takes a while to notice.
  return { cx: Math.floor(tx * sim.w), cy: Math.floor((1 - ty) * sim.h) };
}
let painting = false;
function bindPointer(cv) {
  cv.addEventListener("pointerdown", e => {
    if (PREVIEW) return;
    painting = true; cv.setPointerCapture(e.pointerId);
    const c = canvasToCell(e); sim.paint(c.cx, c.cy, view.brush, 0.5, 0.28);
  });
  cv.addEventListener("pointermove", e => {
    if (!painting) return;
    const c = canvasToCell(e); sim.paint(c.cx, c.cy, view.brush, 0.5, 0.28);
  });
}
bindPointer(poolCanvas);
addEventListener("pointerup", () => { painting = false; });

/* ---------- the parameter map ---------- */
const MAP = { f0: 0.005, f1: 0.100, k0: 0.030, k1: 0.075 };
const mapCanvas = document.getElementById("map");
/* Named by what this build actually produced at these coordinates, looked at
 * on screen at 256x256 after 12,000 steps from the same seed. They are
 * descriptive labels for this page, not a citation of anyone's published
 * table of parameters. */
const PRESETS = [
  { name: "ribbons", F: 0.0140, k: 0.0450 },
  { name: "worms", F: 0.0180, k: 0.0510 },
  { name: "fingerprint", F: 0.0260, k: 0.0550 },
  { name: "grains", F: 0.0300, k: 0.0620 },
  { name: "maze", F: 0.0362, k: 0.0625 },
  { name: "crystals", F: 0.0580, k: 0.0630 },
  { name: "shards", F: 0.0620, k: 0.0610 },
];
function drawMap() {
  const c = mapCanvas.getContext("2d"), W = mapCanvas.width, H = mapCanvas.height;
  const px = F => (F - MAP.f0) / (MAP.f1 - MAP.f0) * W;
  const py = k => H - (k - MAP.k0) / (MAP.k1 - MAP.k0) * H;
  c.clearRect(0, 0, W, H);
  c.fillStyle = "#0a0e13"; c.fillRect(0, 0, W, H);

  // the region where a non-trivial uniform steady state exists, drawn from
  // the closed form k <= sqrt(F)/2 - F rather than from any simulation
  c.beginPath();
  c.moveTo(px(MAP.f0), py(MAP.k0));
  for (let x = 0; x <= W; x++) {
    const F = MAP.f0 + (x / W) * (MAP.f1 - MAP.f0);
    c.lineTo(x, py(Math.max(MAP.k0, Math.min(MAP.k1, boundaryK(F)))));
  }
  c.lineTo(px(MAP.f1), py(MAP.k0));
  c.closePath();
  c.fillStyle = "rgba(95,211,196,0.10)"; c.fill();
  c.strokeStyle = "rgba(95,211,196,0.55)"; c.lineWidth = 1.5; c.stroke();

  // the apex, which is exactly (1/16, 1/16)
  c.fillStyle = "rgba(95,211,196,0.85)";
  c.beginPath(); c.arc(px(0.0625), py(0.0625), 3, 0, 7); c.fill();

  for (const p of PRESETS) {
    c.fillStyle = "rgba(255,255,255,0.62)";
    c.beginPath(); c.arc(px(p.F), py(p.k), 3.5, 0, 7); c.fill();
  }
  // axis ends, so the map is readable without a legend
  c.font = "500 15px ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif";
  c.fillStyle = "rgba(255,255,255,0.42)";
  c.fillText("k " + MAP.k1.toFixed(3), 7, 19);
  c.fillText("k " + MAP.k0.toFixed(3), 7, H - 8);
  c.textAlign = "right";
  c.fillText("F " + MAP.f1.toFixed(3), W - 7, H - 8);
  c.textAlign = "left";
  // crosshair for the live parameters
  const x = px(params.F), y = py(params.k);
  c.strokeStyle = "#ffd479"; c.lineWidth = 1.4;
  c.beginPath(); c.moveTo(x - 9, y); c.lineTo(x + 9, y); c.moveTo(x, y - 9); c.lineTo(x, y + 9); c.stroke();
  c.beginPath(); c.arc(x, y, 5.5, 0, 7); c.stroke();
}
mapCanvas.addEventListener("pointerdown", e => {
  const r = mapCanvas.getBoundingClientRect();
  const F = MAP.f0 + ((e.clientX - r.left) / r.width) * (MAP.f1 - MAP.f0);
  const k = MAP.k1 - ((e.clientY - r.top) / r.height) * (MAP.k1 - MAP.k0);
  setParam("F", F); setParam("k", k);
});

el("bGrid").onclick = () => {
  const sizes = [128, 256, 384, 512];
  view.grid = sizes[(sizes.indexOf(view.grid) + 1) % sizes.length];
  makeSim(view.grid); setPalette(view.palette); newSeed(lastSeed); syncUI();
};
el("bProve").onclick = () => runAudit();

addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); el("bRun").click(); }
  else if (e.key === "s") newSeed();
  else if (e.key === "c") el("bClear").click();
  else if (e.key === "p") runAudit();
  else if (/^[1-5]$/.test(e.key)) setPalette(Object.keys(PALETTES)[+e.key - 1]);
});

/* ================================================================== *
 * PROVE IT. Every reference value here comes from the algebra above,
 * never from this simulation, and it runs on a scratch pool so it cannot
 * disturb the one on screen.
 * ================================================================== */
function maxAbs(a, b, stride, off) {
  let m = 0;
  for (let i = off; i < a.length; i += stride) m = Math.max(m, Math.abs(a[i] - b[i]));
  return m;
}
function fieldStats(state, off) {
  let mn = Infinity, mx = -Infinity, sum = 0, nan = 0;
  for (let i = off; i < state.length; i += 4) {
    const x = state[i];
    if (!Number.isFinite(x)) { nan++; continue; }
    mn = Math.min(mn, x); mx = Math.max(mx, x); sum += x;
  }
  return { min: mn, max: mx, sum, nan };
}

function auditRuns(makeScratch, N = 64) {
  const out = [];
  const fresh = () => { const s = makeScratch(N); return s; };

  // P1 - a uniform field must not move, because the kernel sums to zero
  {
    const s = fresh();
    s.upload(blankState(N, N, 0.37, 0));
    s.step(1000, { F: 0, k: 0, Du: 0.2097, Dv: 0.105 });
    const st = s.read(), f = fieldStats(st, 0);
    const drift = Math.max(Math.abs(f.min - 0.37), Math.abs(f.max - 0.37));
    out.push({ id: "P1", label: "flat water stays flat, 1000 steps",
               got: drift, want: 1e-6, ok: drift < 1e-6 && f.nan === 0,
               fmt: v => v.toExponential(2) });
    s.dispose();
  }

  // P2 - one step of pure diffusion from a single cell, including the wrap
  {
    const s = fresh();
    const st0 = blankState(N, N, 0, 0);
    st0[0] = 1;                                  // cell (0,0)
    s.upload(st0);
    s.step(1, { F: 0, k: 0, Du: 0.2097, Dv: 0.105 });
    const st = s.read();
    const at = (x, y) => st[((y % N + N) % N * N + (x % N + N) % N) * 4];
    const want = { c: 1 - 0.2097, o: 0.2097 * 0.2, d: 0.2097 * 0.05 };
    const err = Math.max(
      Math.abs(at(0, 0) - want.c),
      Math.abs(at(1, 0) - want.o), Math.abs(at(N - 1, 0) - want.o),
      Math.abs(at(0, 1) - want.o), Math.abs(at(0, N - 1) - want.o),
      Math.abs(at(1, 1) - want.d), Math.abs(at(N - 1, N - 1) - want.d),
      Math.abs(at(N - 1, 1) - want.d), Math.abs(at(1, N - 1) - want.d));
    const mass = fieldStats(st, 0).sum;
    out.push({ id: "P2", label: "one drop spreads to nine exact values",
               got: err, want: 1e-6, ok: err < 1e-6, fmt: v => v.toExponential(2) });
    out.push({ id: "P2b", label: "and loses none of itself doing it",
               got: Math.abs(mass - 1), want: 1e-5, ok: Math.abs(mass - 1) < 1e-5,
               fmt: v => v.toExponential(2) });
    // P3 - and keeps not losing it, all the way to a flat pool
    s.step(999, { F: 0, k: 0, Du: 0.2097, Dv: 0.105 });
    const late = s.read(), lf = fieldStats(late, 0);
    const spread = late[0] < 0.01;
    out.push({ id: "P3", label: "still none of it missing 1000 steps later" +
                                (spread ? "" : " (BUT IT NEVER SPREAD)"),
               got: Math.abs(lf.sum - 1), want: 1e-4,
               ok: Math.abs(lf.sum - 1) < 1e-4 && spread && lf.nan === 0,
               fmt: v => v.toExponential(2) });
    s.dispose();
  }

  // P4 - v = 0 collapses the model to u' = F(1-u), which has a closed form
  {
    const s = fresh();
    s.upload(blankState(N, N, 0.5, 0));
    s.step(100, { F: 0.04, k: 0.06, Du: 0.2097, Dv: 0.105 });
    const st = s.read();
    const want = 1 - 0.5 * Math.pow(1 - 0.04 * MODEL.dt, 100);
    const f = fieldStats(st, 0);
    const err = Math.max(Math.abs(f.min - want), Math.abs(f.max - want));
    out.push({ id: "P4", label: "with no V, u relaxes to " + want.toFixed(9),
               got: err, want: 1e-6, ok: err < 1e-6, fmt: v => v.toExponential(2) });
    s.dispose();
  }

  // P5 - the non-trivial steady state, solved by algebra, must not drift
  {
    const F = 0.04, k = 0.055, states = homogeneousStates(F, k);
    const st8 = states[0];
    const s = fresh();
    s.upload(blankState(N, N, st8.u, st8.v));
    s.step(20, { F, k, Du: 0.2097, Dv: 0.105 });
    const st = s.read();
    const fu = fieldStats(st, 0), fv = fieldStats(st, 1);
    const err = Math.max(Math.abs(fu.min - st8.u), Math.abs(fu.max - st8.u),
                         Math.abs(fv.min - st8.v), Math.abs(fv.max - st8.v));
    out.push({ id: "P5", label: "the solved steady state (" + st8.u.toFixed(6) + ", " +
                                st8.v.toFixed(6) + ") holds",
               got: err, want: 1e-5, ok: err < 1e-5, fmt: v => v.toExponential(2) });
    s.dispose();
  }
  return out;
}

function crossCheck(N = 64, steps = 300) {
  const seed = seededState(N, N, 4242, 8);
  const p = { F: 0.0362, k: 0.0625, Du: 0.2097, Dv: 0.105 };
  const cpu = new CpuSim(N, N); cpu.upload(seed); cpu.step(steps, p);
  let gpu = null;
  try { gpu = new GpuSim(N, N); } catch (e) { return null; }
  gpu.upload(seed); gpu.step(steps, p);
  const a = gpu.read(), b = cpu.read();
  const du = maxAbs(a, b, 4, 0), dv = maxAbs(a, b, 4, 1);
  gpu.dispose();
  return { du, dv, steps };
}

function runAudit() {
  const box = el("audit");
  box.innerHTML = "<div>running...</div>";
  setTimeout(() => {
    const lines = [];
    const scratch = N => (sim.kind === "gpu" ? new GpuSim(N, N) : new CpuSim(N, N));
    let rows = [];
    try { rows = auditRuns(scratch); }
    catch (e) { box.innerHTML = "<div class='no'>audit could not run: " + e.message + "</div>"; return; }
    for (const r of rows) {
      lines.push(`<div><b>${r.id}</b> ${r.label}<br>` +
        `&nbsp;&nbsp;<span class="${r.ok ? "ok" : "no"}">${r.ok ? "PASS" : "FAIL"}</span> ` +
        `off by ${r.fmt(r.got)}, allowed ${r.want.toExponential(0)}</div>`);
    }
    const x = crossCheck();
    if (x) {
      const ok = x.du < 2e-3 && x.dv < 2e-3;
      lines.push(`<div><b>P7</b> GPU against the JavaScript reference, ${x.steps} steps<br>` +
        `&nbsp;&nbsp;<span class="${ok ? "ok" : "no"}">${ok ? "PASS" : "FAIL"}</span> ` +
        `worst u ${x.du.toExponential(2)}, worst v ${x.dv.toExponential(2)}, allowed 2e-3</div>`);
    }
    const st = homogeneousStates(params.F, params.k);
    lines.push(`<div style="margin-top:7px">At F=${params.F.toFixed(4)}, k=${params.k.toFixed(4)}: ` +
      (st ? `two stable states exist, V at <b>${st[0].v.toFixed(4)}</b> and <b>${st[1].v.toFixed(4)}</b>.`
          : `no uniform state but empty water. Anything that grows here has to be a pattern.`) + `</div>`);
    box.innerHTML = lines.join("");
  }, 20);
}

/* ---------- boot ---------- */
if (qs.has("grid")) view.grid = Math.max(32, Math.min(768, +qs.get("grid") | 0));
makeSim(view.grid);
setPalette(qs.get("palette") && PALETTES[qs.get("palette")] ? qs.get("palette") : "ember");
if (qs.has("F")) params.F = parseFloat(qs.get("F"));
if (qs.has("k")) params.k = parseFloat(qs.get("k"));
if (qs.has("preset")) {
  const p = PRESETS.find(p => p.name === qs.get("preset"));
  if (p) { params.F = p.F; params.k = p.k; }
}
syncUI();

if (PREVIEW) {
  // The storybook card is a still. Run the pool forward to something worth
  // looking at, draw once, and stop; a card should not burn a GPU forever.
  running = false;
  sim.upload(seededState(sim.w, sim.h, +(qs.get("seed") || 7), 10));
  const total = +(qs.get("steps") || 3500);
  const p = { ...params };
  // Paint the seed immediately rather than after the first chunk. A card that
  // is blank for its first second reads as a broken build to a person and as
  // an unpainted frame to the index checker, and both are avoidable.
  el("previewCaption").innerHTML =
    `<b>Turing Pool</b> &nbsp; two chemicals, four terms &nbsp;&middot;&nbsp; ` +
    `F ${p.F.toFixed(4)} &nbsp; k ${p.k.toFixed(4)}`;
  render();
  let done = 0;
  const chunk = () => {
    const n = Math.min(400, total - done);
    sim.step(n, p); done += n;
    render();
    if (done < total) requestAnimationFrame(chunk);
  };
  requestAnimationFrame(chunk);
  addEventListener("resize", render);
} else {
  newSeed(lastSeed);
  addEventListener("resize", () => { resize(); render(); });
  frame();
}

/* Handle for the headless checkers. They drive the page through real clicks
 * and pointer events and read this only to assert afterwards. */
window.__pool = {
  get sim() { return sim; }, params, view, MODEL, PRESETS, PALETTES,
  homogeneousStates, boundaryK, blankState, seededState, rampOf, coverScale,
  CpuSim, GpuSim, auditRuns, crossCheck, fieldStats, maxAbs, canvasToCell,
  backendNote: () => backendNote,
  isRunning: () => running,
};
</script>
